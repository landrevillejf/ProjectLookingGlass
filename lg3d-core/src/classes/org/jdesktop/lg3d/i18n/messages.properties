# Project Looking Glass - shell UI labels, English source of truth.
#
# Every user-visible label of the 2D shell and the 3D chrome lives here;
# messages_fr.properties carries the French translation. The i18n-keys.mnd
# repository gate (./gradlew :lg3d-mandela:repositoryChecks) fails the build
# when the two files drift apart or when the code asks for a key this file
# does not define.
#
# Conventions, see org.jdesktop.lg3d.i18n.Messages:
#   - keys are dot-separated and prefixed by surface:
#     lg2d.*   the 2D/Swing shell (displayserver/desktop2d)
#     lg3d.*   the 3D chrome (scenemanager/utils: start menu, taskbar, hud, run)
#     lgcfg.*  start-menu descriptor names and descriptions
#   - patterns that take arguments are MessageFormat patterns: double the
#     apostrophes ('') in any pattern that also passes arguments.

