// lg3d-mandela: "Project Mandela" -- the desktop's own scripting language.
//
// The module is the whole tool chain in one jar: lexer, recursive-descent
// parser, AST, bytecode compiler, stack VM, the capability-gated runtime and
// standard library, a JSR-223 ScriptEngine, an embedding API for Java and
// Kotlin hosts, and the `mandela` command line / REPL.
//
// It deliberately has NO third-party dependency and NO lg3d-core dependency:
//  * "light weight" -- the jar is the language, nothing else; it adds no
//    transitive surface to the desktop classpath (see the root AGENTS.md
//    dependency notes for the modules that do carry libraries).
//  * it embeds everywhere -- lg3d-apps' Espresso (text editor) and the Web
//    Browser both depend on it, and a host that is not the desktop (a plain
//    JVM tool, a test, a Kotlin script) can drop the jar on its classpath and
//    use javax.script or the org.jdesktop.lg3d.mandela.api facade directly.
//
// The toolchain (JDK 21), UTF-8 encoding, the build-gradle output directory,
// checkstyle (report-only) and jacoco are inherited from the root build.gradle
// subprojects block. The Maven-standard source layout (src/main/java,
// src/test/java, src/main/resources) is kept as-is, so no sourceSet override is
// needed.

// Mandela's own version, not the desktop's. The root build.gradle puts
// `1.69.0-dev` on every module through `allprojects`, and this line overrides it
// here alone: a zero-dependency language cannot be counted in desktop releases,
// because a host that drops the jar on its classpath has to be told which
// language a script may assume. Both numbers come from gradle.properties, so a
// Mandela bump is one edit in one place; scripts/mandela/mandela-version.mnd is
// the registered gate that keeps the jar, the two constants in api/Mandela.java,
// the two guides and lg3d-mandela/CHANGELOG.md saying the same thing. The
// desktop's release train never rewrites these lines, and the bundle's `lib/*`
// wildcard classpath does not care what the file is called.
version = providers.gradleProperty('mandela.version').get()

jar {
    archiveBaseName = 'lg3d-mandela'
    manifest {
        attributes 'Main-Class': 'org.jdesktop.lg3d.mandela.cli.MandelaCli',
                // What a host reads when it asks the artifact who it is; the CLI
                // prints the same two numbers from the same two sources.
                'Implementation-Title': 'Project Mandela',
                'Implementation-Version': version,
                'Specification-Title': 'Mandela',
                'Specification-Version': providers.gradleProperty('mandela.language').get()
    }
}

// No `dependencies { implementation ... }` block at all: the language uses only
// the JDK (java.base + javax.script). JUnit is test-only, and so is Cucumber: the
// BDD layer runs .feature scenarios against the real api/rt/cli surfaces inside
// the `test` task, adding scenario coverage without putting anything on the
// published jar's classpath (the zero-dependency promise is a runtime property,
// not a test one).
dependencies {
    testImplementation platform(libs.junit.bom)
    testImplementation platform(libs.cucumber.bom)
    testImplementation libs.junit.jupiter
    testImplementation libs.junit.platform.suite
    testImplementation libs.cucumber.java
    testImplementation libs.cucumber.junit.platform.engine
    testRuntimeOnly libs.junit.platform.launcher
}

tasks.named('test') {
    useJUnitPlatform()
    // The module is AWT/Swing-free, but the hosts that embed it are not: force
    // headless so the suite stays deterministic and CI-safe.
    systemProperty 'java.awt.headless', 'true'
}

// ---------------------------------------------------------------------------
// mandelaRun: run a script with the freshly built engine, no packaging step
// ---------------------------------------------------------------------------
// `./gradlew :lg3d-mandela:mandelaRun -Pscript=hello.mnd` executes a Mandela
// source file on the module's own classes (not the jar), and
// `./gradlew :lg3d-mandela:mandelaRepl` starts the interactive REPL. Both are
// developer conveniences; the desktop uses the packaged jar on its run
// classpath instead (see lg3d-core/build.gradle).
tasks.register('mandelaRun', JavaExec) {
    group = 'application'
    description = 'Run a Mandela script (pass -Pscript=path/to/file.mnd; extra args after -Pargs=).'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.jdesktop.lg3d.mandela.cli.MandelaCli'
    def script = project.findProperty('script')?.toString()
    args = (script == null) ? ['--help'] : (['run', script] +
            (project.findProperty('args')?.toString()?.split(' ')?.findAll { it } ?: []))
}

tasks.register('mandelaRepl', JavaExec) {
    group = 'application'
    description = 'Start the interactive Mandela REPL.'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.jdesktop.lg3d.mandela.cli.MandelaCli'
    args = ['repl']
    standardInput = System.in
}

// ---------------------------------------------------------------------------
// repositoryChecks: the desktop's own tools, dogfooded on this repository
// ---------------------------------------------------------------------------
// scripts/mandela holds automation written *in* Mandela and aimed at this
// repository: a documentation-link checker, an HTML/Mermaid checker for the
// Pages site, a release-consistency gate, a version-consistency gate for the
// language itself, a changelog-shape gate, a start-menu descriptor audit, an
// accelerator-conflict gate, an i18n bundle-completeness gate, a legacy Java 3D
// import lint, a gate on the two hand-written copies of the desktop classpath,
// a gate on what the coverage floors may claim, a freshness gate on the generated
// What's New help topic and on the release archive drawn from the same changelog,
// and a gate on the automation's own wiring. They
// are ordinary `mandela run` invocations, so
// the only thing these tasks add is the sandbox and the classpath -- run against
// the module's compiled classes, confined to the repository root, with no jar to
// assemble first:
//
//   ./gradlew :lg3d-mandela:repositoryChecks      (all fourteen)
//   ./gradlew :lg3d-mandela:docLinksCheck         (one at a time)
//
// Deliberately NOT wired into `check`: these audit the whole tree rather than
// this module, so a stale link in unrelated documentation would redden the
// language module's build and misdirect the blame. CI runs them as their own
// visible step instead (see .github/workflows/build.yml), where a failure names
// the file and line the script found. Each task exits non-zero on a finding,
// which is what makes JavaExec fail.
def repoRoot = rootProject.projectDir
def scriptDir = new File(repoRoot, 'scripts/mandela')

def mandelaCheck = { String name, String script, String what ->
    tasks.register(name, JavaExec) {
        group = 'verification'
        description = what
        javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(21)
        }
        classpath = sourceSets.main.runtimeClasspath
        mainClass = 'org.jdesktop.lg3d.mandela.cli.MandelaCli'
        workingDir = repoRoot
        // `-s .` in the docs below is the same sandbox spelled by hand; here the
        // absolute root is passed so the task works from any directory.
        args = ['run', new File(scriptDir, script).toString(), '-s', repoRoot.toString()]
    }
}

mandelaCheck('docLinksCheck', 'doc-links.mnd',
        'Fail when a relative link in the repository documentation does not resolve.')
mandelaCheck('htmlLinksCheck', 'html-links.mnd',
        'Fail when the Pages documentation site carries a dead href/src/viewer path or a broken mermaid fence.')
mandelaCheck('releaseCheck', 'release-check.mnd',
        'Fail when the version references or settings.gradle disagree with the tree.')
mandelaCheck('mandelaVersionCheck', 'mandela-version.mnd',
        "Fail when the language's own version (jar and language axes) is written inconsistently across gradle.properties, api/Mandela.java, the two guides, the module changelog and the scripts README.")
mandelaCheck('changelogCheck', 'changelog-check.mnd',
        'Fail when CHANGELOG.md grows a header, group name or ordering its three readers (help topic, release archive, Update Manager) cannot parse.')
mandelaCheck('startMenuAudit', 'startmenu-audit.mnd',
        'Report the start-menu inventory and fail when a live descriptor does not resolve.')
mandelaCheck('acceleratorsCheck', 'accelerators.mnd',
        "Fail when a keyboard shortcut can never fire: a window-manager grab, a chord that shadows the shell's window switcher, or two shell bindings that normalise to one stroke.")
mandelaCheck('i18nKeysCheck', 'i18n-keys.mnd',
        'Fail when a Messages.tr key is missing from the shell bundle or the French bundle drifts from the base.')
mandelaCheck('legacyJ3dCheck', 'legacy-j3d.mnd',
        'Fail when a built source imports a pre-migration Java 3D package (javax.media.j3d / javax.vecmath / com.sun.j3d).')
mandelaCheck('runClasspathCheck', 'run-classpath.mnd',
        'Fail when the hand-assembled :lg3d-core:run classpath and the releaseBundle classpath stop describing the same desktop.')
mandelaCheck('coverageFloorsCheck', 'coverage-floors.mnd',
        'Fail when a coverageFloors floor names a module with no test suite, or a module with a suite carries no floor and no exemption.')
mandelaCheck('exclusionsCheck', 'exclusions.mnd',
        'Fail when the source excludes the build files apply and the exclusion prose AGENTS.md states stop being the same set, or an exclude names a tree that holds nothing.')
mandelaCheck('scriptsHygieneCheck', 'scripts-hygiene.mnd',
        'Fail when a Mandela gate is unwired, left out of repositoryChecks, or missing from the scripts README.')
mandelaCheck('whatsNewCheck', 'whats-new.mnd',
        "Fail when the generated What's New help topic or a documentation/releases/ archive page no longer matches CHANGELOG.md.")

tasks.register('repositoryChecks') {
    group = 'verification'
    description = 'Run every Mandela script that audits this repository.'
    dependsOn 'docLinksCheck', 'htmlLinksCheck', 'releaseCheck', 'startMenuAudit',
            'acceleratorsCheck',
            'i18nKeysCheck', 'legacyJ3dCheck', 'runClasspathCheck', 'coverageFloorsCheck',
            'exclusionsCheck',
            'scriptsHygieneCheck', 'whatsNewCheck',
            'mandelaVersionCheck', 'changelogCheck'
}

// todo-scan.mnd is a report, not a gate (the asset-report.mnd kind): it always
// exits 0 and prints the tree's open TODO/FIXME markers, so it is wired as its
// own task and deliberately NOT in `repositoryChecks` - a report has nothing to
// fail on, and a marker is a note rather than a defect.
tasks.register('todoScan', JavaExec) {
    group = 'reporting'
    description = 'Inventory the open TODO/FIXME markers in the root notes and built sources (report-only, never fails).'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.jdesktop.lg3d.mandela.cli.MandelaCli'
    workingDir = repoRoot
    args = ['run', new File(scriptDir, 'todo-scan.mnd').toString(), '-s', repoRoot.toString()]
}

// startmenu-categories.mnd is a report of the same kind: it always exits 0 and
// prints the start-menu items whose description reads like a different category
// than the group they are filed under. Category is a judgement, not an
// invariant, so it is wired as its own reporting task and deliberately NOT in
// `repositoryChecks` - a soft suggestion the reader weighs, never a red build.
tasks.register('startmenuCategories', JavaExec) {
    group = 'reporting'
    description = 'Report the start-menu items whose description reads like a different category than their group (report-only, never fails).'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.jdesktop.lg3d.mandela.cli.MandelaCli'
    workingDir = repoRoot
    args = ['run', new File(scriptDir, 'startmenu-categories.mnd').toString(), '-s', repoRoot.toString()]
}

// The other half of whats-new.mnd: the same script, run with its `write` mode
// word, rendering CHANGELOG.md into the committed help topic AND into one page per
// released version under documentation/releases/, with an index above them. A
// generator rather than a checker, so deliberately NOT in `repositoryChecks` and NOT
// in `check` - `check` may never rewrite a tracked file. The pair is the deal: edit
// the changelog, run this, and whatsNewCheck (above, in CI) proves every shipped
// page is the one the changelog describes.
tasks.register('whatsNewRefresh', JavaExec) {
    group = 'verification'
    description = "Regenerate the What's New help topic and the documentation/releases/ archive from CHANGELOG.md."
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.jdesktop.lg3d.mandela.cli.MandelaCli'
    workingDir = repoRoot
    args = ['run', new File(scriptDir, 'whats-new.mnd').toString(), 'write',
            '-s', repoRoot.toString()]
}

// ---------------------------------------------------------------------------
// PIT mutation testing (report-only, on-demand)
// ---------------------------------------------------------------------------
// AGENTS.md calls 0 surviving mutants mandatory; PIT makes that measurable on
// the language core, where a silently wrong operator or comparison is the worst
// possible defect. NOT part of `build`/`check`: run
// `./gradlew :lg3d-mandela:pitest` explicitly. mutationThreshold = 0 keeps the
// report informational (the suite is new; the gate is deferred repo-wide).
apply plugin: 'info.solidsoft.pitest'
pitest {
    pitestVersion = libs.versions.pitest.get()
    junit5PluginVersion = libs.versions.pitestJunit5.get()
    threads = 4
    targetClasses = ['org.jdesktop.lg3d.mandela.*']
    targetTests = ['org.jdesktop.lg3d.mandela.*Test']
    outputFormats = ['HTML', 'XML']
    mutationThreshold = 0
    timestampedReports = false
}
