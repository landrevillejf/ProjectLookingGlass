rootProject.name = 'lg3d'

include 'lg3d-escher'
include 'lg3d-core'
include 'lg3d-apps'
include 'lg3d-incubator'
// Desktop widgets: the public widget API (org.jdesktop.lg3d.widgets.api) plus
// the desktop widget layer and the built-in clock/temperature/CPU/memory
// widgets. Depends on lg3d-core; the :lg3d-core:run task puts its jar on the
// desktop classpath and glassy.lgcfg registers its WidgetLayerPlugin.
include 'lg3d-widgets'
// LPM Console: Graphical front-end for LPM package manager
// Standalone Java 21 Swing application that runs as X11 client
include 'lpm-console'
// Update manager: a self-contained Swing update pipeline (check / download /
// verify / install / rollback / downgrade / scheduling / PGP signing) adapted
// from an external module. lg3d-apps wraps its settings panel in a
// "Software Update" start-menu app (SwingNode in 3D, MDI internal frame in 2D);
// the :lg3d-core:run task puts its jar and runtime deps on the desktop classpath.
include 'update-manager'
// Database Manager: a self-contained, driver-agnostic JDBC database client
// (connection profiles, metadata navigator, SQL editor, results grid, CSV
// export) styled after DBeaver. Plain Java 21 Swing library with no lg3d-core
// dependency; lg3d-apps wraps its DbManagerMainPanel in a "Database Manager"
// start-menu app (SwingNode in 3D, MDI internal frame in 2D), and the
// :lg3d-core:run task puts its jar plus the bundled JDBC drivers on the desktop
// classpath.
include 'db-manager'
// FTP Client: a self-contained, secure file-transfer client speaking FTP and
// FTPS (Apache Commons Net) and SFTP (the JSch mwiede fork). Plain Java 21
// Swing library with no lg3d-core dependency; lg3d-apps wraps its
// FtpClientMainPanel in an "FTP Client" start-menu app (SwingNode in 3D, MDI
// internal frame in 2D), and the :lg3d-core:run task puts its jar plus its
// protocol/runtime libraries on the desktop classpath.
include 'ftp-client'
// Mandela: the desktop's own scripting language -- lexer, recursive-descent
// parser, bytecode compiler and stack VM, capability-gated runtime and standard
// library, a JSR-223 engine and an embedding API for Java and Kotlin hosts.
// Plain Java 21 with no third-party dependency and no lg3d-core dependency, so
// it embeds anywhere: Espresso (org.jdesktop.lg3d.apps.texteditor.MandelaTools)
// and the Web Browser (the Mandela userscript extension) both call into it, and
// :lg3d-core:run / releaseBundle put its jar on the desktop classpath.
include 'lg3d-mandela'

// lg3d-awt is RETIRED — it is not, and will not be, part of the Gradle build.
//
// It was an optional, self-contained custom AWT Toolkit / peer implementation
// ("jawt"): 46 of its 79 classes implement the java.awt.peer.* SPI and 9 use
// JDK-internal sun.awt.* types (SunToolkit, AppContext, CausedFocusEvent,
// image.OffScreenImage, X11.XToolkit, windows.WToolkit). JDK 9+ removed the
// java.awt.Toolkit "awt.toolkit" hook that installed it, those sun.awt.*
// internals are unexported in the JDK 21 java.desktop module, and the peer SPI
// itself changed substantially after JDK 5. A faithful port would therefore
// require reimplementing a JDK-internal subsystem plus matching
// --add-exports/--add-opens at runtime, which stock JDK 21 does not support.
//
// Replacement mapping (both replacements are already in-tree and build on stock
// JDK 21):
//   - 2D-in-3D widget bridge (Swing/AWT widgets shown inside the 3D scene)
//       -> org.jdesktop.lg3d.wg.SwingNode, lg3d's own pure-Java bridge that
//          paints Swing into an offscreen BufferedImage and textures it onto a
//          quad (no JavaFX, no AWT peer); used by
//          org.jdesktop.lg3d.apps.TitledSwingWindow.
//   - foreign X11 application compositing (real external X clients redirected
//     into the 3D desktop)
//       -> org.jdesktop.lg3d.displayserver.nativewindow.x11, the pure-Java
//          Escher/gnu.x11 compositor (X11WindowManager + X11Compositor +
//          X11InputForwarder), gated by lg3d.x11.compositor=true.
//
// The toolkit was only ever activated via lg.use3dtoolkit=true (default false)
// and loaded dynamically through java.awt.Toolkit, so lg3d-core has no
// compile-time dependency on it. Its sources remain in-tree under lg3d-awt/ for
// historical reference only — do not resurrect or build them.
