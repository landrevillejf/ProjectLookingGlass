# Centralized dependency versions for the LG3D modernization port.
#
# Gradle auto-loads this file as the `libs` version catalog (Gradle 7+), so every
# module references coordinates as e.g. `libs.java3d.core` instead of hardcoding
# group:name:version strings. Keeping the versions here means a Jogamp / JUnit /
# SLF4J bump is a one-line change instead of an edit scattered across modules.
#
# The Jogamp *native* classifier jars (gluegen-rt / jogl-all / joal with a
# platform-specific classifier such as natives-linux-amd64) are NOT declared as
# libraries: their classifier is computed at configuration time in
# lg3d-core/build.gradle. Those declarations reference [versions].jogampNatives
# directly so the version still lives here.

[versions]
java3d = "1.7.2"          # Jogamp-maintained fork of the Sun Java 3D 1.5/1.6 API
jogampNatives = "2.6.0"   # GlueGen / JOGL / JOAL native libraries
junit = "5.11.4"          # JUnit 5 BOM (Jupiter + Platform versions follow it)
slf4j = "2.0.16"          # SLF4J API + no-op provider (jbusinessday runtime dep)
javahelp = "2.0.05"       # JavaHelp (javax.help) Swing help framework, latest release
checkstyle = "10.18.2"    # Checkstyle tool version (parses modern Java syntax)
pitestPlugin = "1.15.0"   # info.solidsoft.pitest Gradle plugin
pitest = "1.17.0"         # PIT mutation-testing engine
pitestJunit5 = "1.2.1"    # PIT <-> JUnit 5 bridge

# Build-analysis plugins. Declared here (not hardcoded in build.gradle) so a
# bump is a one-line change; applied with `apply false` at the root and enabled
# per module. All run report-only / on-demand so they never red-line `build`.
cyclonedx = "1.8.2"             # CycloneDX SBOM generation
dependencyCheck = "10.0.4"      # OWASP dependency-check (CVE scanning)

[libraries]
# Java 3D (Jogamp). Exposed transitively by lg3d-core to every downstream module.
java3d-core = { module = "org.jogamp.java3d:java3d-core", version.ref = "java3d" }
java3d-utils = { module = "org.jogamp.java3d:java3d-utils", version.ref = "java3d" }
vecmath = { module = "org.jogamp.java3d:vecmath", version.ref = "java3d" }

# JUnit 5. jupiter / platform-launcher carry no explicit version: the BOM below
# constrains them, so bumping [versions].junit moves the whole test stack.
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

# SLF4J. jbusinessday (bundled in libs/) logs through SLF4J and touches
# LoggerFactory in a static initializer, so the API plus a silent no-op provider
# must be on the runtime classpath.
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-nop = { module = "org.slf4j:slf4j-nop", version.ref = "slf4j" }

# JavaHelp: the platform-independent Swing help framework (javax.help). Its
# JHelp viewer is a plain Swing component, so the desktop Help Center hosts it
# on a SwingNode (3D desktop) or in an MDI internal frame (2D/Swing desktop).
# Used by lg3d-demo-apps; also resolved onto the lg3d-core run classpath.
javahelp = { module = "javax.help:javahelp", version.ref = "javahelp" }

[plugins]
# Third-party Gradle plugins (Checkstyle / JaCoCo / signing are built in and
# need no alias). Referenced from the root build.gradle `plugins {}` block as
# e.g. `alias(libs.plugins.cyclonedx) apply false`.
cyclonedx = { id = "org.cyclonedx.bom", version.ref = "cyclonedx" }
pitest = { id = "info.solidsoft.pitest", version.ref = "pitestPlugin" }
dependencyCheck = { id = "org.owasp.dependencycheck", version.ref = "dependencyCheck" }
