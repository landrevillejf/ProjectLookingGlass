// lg3d-widgets: the desktop widget framework and the built-in desktop widgets.
//
// A dedicated module exposing a public, pluggable widget API
// (org.jdesktop.lg3d.widgets.api) plus a desktop widget layer/host
// (org.jdesktop.lg3d.widgets.host) and built-in widgets
// (org.jdesktop.lg3d.widgets.builtin: clock, temperature, CPU, memory).
//
// Widgets are discovered through the standard java.util.ServiceLoader SPI
// (org.jdesktop.lg3d.widgets.api.WidgetProvider), so a third party can add
// widgets just by dropping a jar with a META-INF/services entry on the desktop
// classpath -- no changes to this module or to lg3d-core are required.
//
// Pure Java, compiled against lg3d-core (which exposes the Jogamp Java 3D API
// and the org.jdesktop.lg3d.utils.system Linux backends transitively). The
// :lg3d-core:run task puts lg3d-widgets.jar on the desktop classpath, and the
// WidgetLayerPlugin is registered as a scene-manager plugin from glassy.lgcfg.
//
// The toolchain (JDK 21), encoding, build directory and java-library plugin are
// inherited from the root build.gradle subprojects block.

sourceSets {
    main {
        java {
            srcDir 'src/classes'
            include 'org/**'
        }
        resources {
            // META-INF/services (the WidgetProvider SPI registration) and any
            // widget/gallery assets live under src/resources.
            srcDir 'src/resources'
        }
    }
    test {
        java {
            srcDir 'src/test/java'
        }
    }
}

jar {
    archiveBaseName = 'lg3d-widgets'
}

dependencies {
    implementation project(':lg3d-core')

    // Unit tests for the Java 3D-free widget layer. The pure-Swing cards, the
    // 2D SwingWidgetLayer host and the gallery panel are plain Swing, so they
    // are exercised headless (a JDesktopPane/JPanel needs no X display).
    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.platform.launcher
}

tasks.named('test') {
    useJUnitPlatform()
    // The widget cards/layer are pure Swing; run headless so CI (no X display)
    // does not fail on the JDesktopPane/JPanel the tests build.
    systemProperty 'java.awt.headless', 'true'
}

// ---------------------------------------------------------------------------
// PIT mutation testing (report-only, on-demand)
// ---------------------------------------------------------------------------
// AGENTS.md calls 0 surviving mutants mandatory; PIT makes that measurable. It
// is NOT part of `build`/`check` (mutation analysis is slow), so run it
// explicitly: `./gradlew :lg3d-widgets:pitest`. mutationThreshold=0 means
// surviving mutants never fail the build; the HTML/XML report under
// build-gradle/reports/pitest shows which mutants the tests catch.
apply plugin: 'info.solidsoft.pitest'
pitest {
    pitestVersion = libs.versions.pitest.get()
    junit5PluginVersion = libs.versions.pitestJunit5.get()
    threads = 4
    outputFormats = ['HTML', 'XML']
    mutationThreshold = 0
    timestampedReports = false
    // Do not mutate into GUI calls: they cannot run headless inside a mutation
    // sandbox and would only produce spurious "killed by error" noise.
    avoidCallsTo = ['java.awt', 'javax.swing']
}
