org.gradle.jvmargs=-Xmx2g
org.gradle.java.installations.auto-detect=true

# Project Mandela carries a version of its own, deliberately NOT the desktop's.
# The module depends on nothing (`java.base` + `javax.script`), so it releases on
# its own clock and a host that drops the jar on its classpath has to be told
# which language a script may assume -- which 1.69.0-dev cannot answer. Two axes,
# each written in several places (the property here, the matching constant in
# `api/Mandela.java`, the two guides and the module's changelog), and
# scripts/mandela/mandela-version.mnd is the gate that fails the build the moment
# one of those copies stops agreeing with the others:
#
#   mandela.version   the jar, the implementation  -> Mandela.IMPLEMENTATION_VERSION
#   mandela.language  the language itself          -> Mandela.LANGUAGE_VERSION
#
# The desktop's release train and its bump chores never touch these two lines;
# bumping Mandela is its own module-scoped chore, recorded in
# lg3d-mandela/CHANGELOG.md.
mandela.version=1.1.0
mandela.language=1.0
