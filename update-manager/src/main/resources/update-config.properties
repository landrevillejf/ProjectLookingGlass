# Update Configuration
update.enabled=true
# Interval between two automatic checks. Remove (or leave empty) to use the
# interval recommended by the selected update channel.
update.check.interval.hours=24
# Metadata endpoint queried by UpdateRepository. Must serve the version.json
# published by .github/workflows/release.yml. The default points at the GitHub
# Releases latest-asset redirect; override it here (or in the user file under
# ~/.lg3d/update-config.properties) to target a mirror or a private host.
update.url=https://github.com/landrevillejf/ProjectLookingGlass/releases/latest/download/version.json
# Bearer token used to read the release assets of a PRIVATE repository. Leave it
# empty to fall back on the LG3D_UPDATE_TOKEN or GITHUB_TOKEN environment
# variables. A fine-grained personal access token with read-only "Contents" access
# to this repository is enough; the token is attached only to same-host requests
# and is never forwarded to the redirect target that serves the file.
# Prefer the environment variables over writing the token to this file.
update.github.token=
update.auto.download=false
update.auto.install=false
update.notify.on.startup=true
# Release channel: stable (final releases), beta (pre-releases), nightly (every build)
update.channel=stable

# Phase 6 - Advanced features

# Show update events as desktop notifications (system tray / notification center)
update.notifications.tray.enabled=true
# Directory holding the versioned archives used by the downgrade feature.
# Empty = <user.home>/.lg3d/backups/versions
update.downgrade.dir=
# Number of versioned archives kept for downgrade
update.downgrade.keep=3
# Local changelog rendered when the remote changelog is unreachable.
# Empty = <user.dir>/changelog.md when it exists
update.changelog.path=
# Delay before the restart notification of a scheduled installation, in seconds
update.schedule.restart.delay.seconds=5

# Phase 7 - Security and automation

# Verify the OpenPGP detached signature of a downloaded update before installing.
# When false, only the SHA-256 checksum is enforced (previous behaviour).
update.signature.enabled=false
# Classpath resource holding the bundled release public keyring.
update.signature.public.key.resource=public-key.asc
# Default signing key id, used when the metadata advertises none.
update.signature.key.id=
# Expected fingerprint of the signing key; enables strict key validation when set.
update.signature.fingerprint=
# When true, an update whose signature cannot be verified is rejected. When false,
# a missing key/signature only logs a warning (a present-but-invalid signature
# always fails, whatever this flag says).
update.signature.required=false

# Prompt for administrative privileges when the IDE lives in a read-only location.
update.privilege.escalation.enabled=true

# Roll back automatically on the next start when an updated IDE fails its health check.
update.rollback.enabled=true
