// wonderland-desktop: the PURE mount/routing half of the wonderland-in-lg3d
// bridge -- the cell mount/unmount/transform/visibility bookkeeping (behind the
// FrameMounter seam), the pick routing, the session feed and the HUD model.
//
// The lg3d-coupled half (WonderlandDesktop, WonderlandWorldContainer,
// WorldInputRouter, WonderlandDesktopPlugin -- the Component3D / Frame3D /
// LgEventListener classes) lives in lg3d-apps' org.jdesktop.lg3d.apps.wonderland
// package, so the dependency points the one way the architecture allows:
// lg3d-apps -> wonderland-desktop, never wonderland -> lg3d. This module is
// lg3d-free AND Java-3D-free: it depends only on wonderland-client (Cell +
// session), wonderland-common (CellTransform, CellID) and wonderland-renderer
// (WorldTransformMath's pure matrix feed -- no Java 3D type at the call site).
//
// Coverage model: the pure mapping / bookkeeping logic is headless-tested with a
// FrameMounter recording stub; the live Component3D / Frame3D construction moved
// to lg3d-apps and is verified by the in-JVM probe, not asserted in CI.

jar { archiveBaseName = 'wonderland-desktop' }

dependencies {
    // The cell renderer seam + Cell types (Cell, CellRenderer, AvatarCell, etc).
    implementation project(':wonderland-client')
    // WorldTransformMath only: the pure node-matrix / CellTransform -> row-major
    // double[16] feed CellFrameBridge hands its FrameMounter. The call site names
    // no Java 3D type, so this module needs no java3d/vecmath compile dep.
    implementation project(':wonderland-renderer')
    // The pure data model (CellTransform, CellID, CellStatus, AvatarCellServerState).
    implementation project(':wonderland-common')

    // Headless JUnit 5 + AssertJ.
    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.platform.launcher
    testImplementation libs.assertj.core
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'java.awt.headless', 'true'
}

pitest {
    targetClasses = ['org.jdesktop.wonderland.desktop.*']
}
