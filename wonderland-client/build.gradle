// wonderland-client: the cell/comms client model + the Java 3D renderer.
// Scaffolded in M0; M2 ports it in bottom-up increments onto wonderland-common
// (the shared data model landed in M0/M1). The milestone was re-sliced by what
// can be verified HEADLESS in CI today, since the repo mandates per-module
// coverage and the excluded AWT peer means a live scene graph is not testable:
//
//   M2a  the self-contained cell *leaf* layer -- annotations, SPIs, the
//        listener/callback interfaces and CellCreationException (no logic yet).
//   M2b  (this PR) the first REAL logic that still depends on nothing beyond
//        wonderland-common + the JDK: the CellSelectionRegistry singleton, the
//        headless view/renderer CONTRACTS (ClientView, CellRenderer -- interface
//        only, no scene-graph type), and the comms response substrate (the
//        exception hierarchy, LoginParameters / WonderlandServerInfo value
//        types, and the Wait / OK-Error response listeners). Fully covered.
//   M2c  the Cell base class, the comms/session connection layer (BaseConnection
//        / WonderlandSession), the login layer and the client/jme renderer --
//        all of which pull lg3d-core (Java 3D) and the jME scene-graph shim and
//        are verified with the in-JVM probe, not asserted as headless green.
//
// The toolchain (JDK 21), UTF-8 encoding, build-gradle output directory,
// checkstyle (report-only) and jacoco are inherited from the root build.gradle
// subprojects block. The Maven-standard layout (src/main/java, src/test/java)
// matches wonderland-common.
//
// Replacements applied here mirror the module plan (docs/wonderland-migration.md):
//   - javax.vecmath.*  -> org.jogamp.vecmath.*   (house Java 3D migration; via
//                        wonderland-common's api vecmath, so no direct dep here yet)
//   - javax.media.j3d / com.sun.j3d / com.jme.scene / renderer / system / util ->
//        deferred to M2c; those are the renderer tree, not the headless slice.

jar { archiveBaseName = 'wonderland-client' }

dependencies {
    // The shared data model (cells, transforms, messages, the com.jme math/bounding
    // shim) the client consumes; vecmath + JAXB arrive transitively through its api.
    implementation project(':wonderland-common')

    // Headless JUnit 5 + AssertJ back the module's M2a/M2b test suite.
    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.platform.launcher
    testImplementation libs.assertj.core
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'java.awt.headless', 'true'
}

pitest {
    targetClasses = ['org.jdesktop.wonderland.client.*']
}
