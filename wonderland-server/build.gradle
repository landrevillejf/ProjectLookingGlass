// wonderland-server: the session/host server that replaces the bundled
// GlassFish 3.0 + Sun Game Server (SGS) + Apache MINA + JAX-RS stack.
// Scaffolded in M0; M3 rebuilds it on Spring Boot 3 (docs/wonderland-migration.md,
// "rebuild vs. port"): the Wonderland wire protocol (M1's MessagePacker) rides a
// Spring WebSocket handler, the SGS session/login oracle becomes a plain
// @Service session registry, and the wonderland-wfs REST surface becomes
// @RestControllers. No GlassFish / SGS / MINA is ported.
//
// M3a is the single-JVM loopback increment: the server's session registry +
// protocol router are real and exercised through the real MessagePacker codec by
// an in-JVM transport that drives a real wonderland-client CellClientSession.
// The WebSocket/REST classes compile and are unit-tested headless (MockMvc /
// direct handler calls); the real socket endpoint + boot repackage land in M3b.
//
// Depends on wonderland-common ONLY (the shared wire/data model). It does NOT
// import wonderland-client or lg3d-core in production code -- that would invert
// the repo dependency rule. wonderland-client appears only in TEST scope, so the
// loopback integration test can drive the real client against the real router.

// The Spring Boot Gradle plugin (version managed once in the root plugins block).
// It supplies `bootRun` and an executable `bootJar` -- the entry points that make
// the server actually startable and configurable outside a test JVM. The module's
// application.properties already documents `bootRun` / SERVER_PORT / -Dserver.port,
// but until this plugin was applied those entry points did not exist: the @SpringBootTest
// suite boots Tomcat in-JVM and so never revealed the gap.
plugins {
    alias(libs.plugins.springboot)
}

springBoot {
    mainClass = 'org.jdesktop.wonderland.server.WonderlandServerApplication'
}

// The Boot plugin disables the plain `jar` by default and, when re-enabled,
// forces its classifier to `plain`. Keep the library jar under its bare, expected
// name (the CI "module jars" artifact and any consumer resolve it there) and put
// the executable fat jar alongside it under the `-app` classifier.
jar {
    enabled = true
    archiveBaseName = 'wonderland-server'
    archiveClassifier = ''
}

tasks.named('bootJar') {
    archiveClassifier = 'app'
}

// The Spring Boot BOM upgrades JAXB to 4.x, which renamed the packages from
// `javax.xml.bind` to `jakarta.xml.bind`. The ported Wonderland data model
// (wonderland-common's CellServerState, and the M5 WorldLoader the WorldSeeder
// drives) is written against `javax.xml.bind.*`, so on the server's classpath
// the 4.x artifacts leave those classes missing (NoClassDefFoundError:
// javax/xml/bind/JAXBException) and a world silently fails to seed. Pin the
// javax-namespace JAXB line back to 2.3.x here. This is safe for this module:
// the server speaks JSON (REST) + a binary WebSocket codec and nothing on its
// classpath consumes the `jakarta.xml.bind` package, so Spring needs no 4.x.
configurations.all {
    resolutionStrategy {
        force 'jakarta.xml.bind:jakarta.xml.bind-api:2.3.3'
        force 'org.glassfish.jaxb:jaxb-runtime:2.3.9'
        force 'org.glassfish.jaxb:jaxb-core:2.3.0.1'
        force 'org.glassfish.jaxb:txw2:2.3.9'
        force 'com.sun.istack:istack-commons-runtime:3.0.12'
    }
}

dependencies {
    // The shared data model + the M1 wire codec (MessagePacker) the server speaks.
    implementation project(':wonderland-common')

    // World seeding (WorldSeeder): the M5 asset pipeline (WorldLoader + the
    // classpath WorldStore) that reads a world module's cells. A pure layer with
    // no client / lg3d-core dependency, so the repo dependency rule holds.
    implementation project(':wonderland-modules')

    // Spring Boot, version-managed by the BOM (gradle/libs.versions.toml).
    // web -> embedded Tomcat + the REST stack; websocket -> the wire-protocol
    // handler; validation -> bean validation on the REST surface.
    api platform(libs.spring.boot.bom)
    implementation platform(libs.spring.boot.bom)
    implementation libs.spring.boot.starter.web
    implementation libs.spring.boot.starter.websocket
    implementation libs.spring.boot.starter.validation

    // Headless tests: spring-boot-starter-test carries JUnit 5 + AssertJ +
    // Mockito + MockMvc; the loopback integration test pulls the real client.
    testImplementation platform(libs.spring.boot.bom)
    testImplementation libs.spring.boot.starter.test
    testImplementation project(':wonderland-client')
    testRuntimeOnly libs.junit.platform.launcher
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'java.awt.headless', 'true'
}
