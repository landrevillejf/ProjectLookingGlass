# wonderland-server (M3b): the session/host server binds real ports here.
# The Spring Boot lifecycle (WonderlandServerApplication) owns embedded Tomcat,
# so a plain `bootRun`/executable jar serves:
#   - the REST world surface (WorldRestController) at http://<host>:<port>/api/world
#   - the wire-protocol WebSocket endpoint (CommsWebSocketHandler, M1 codec) at
#     ws://<host>:<port>/comms
# The port is overridable with SERVER_PORT / -Dserver.port. Tests do NOT rely on
# this file: they boot the same context on a random free port
# (@SpringBootTest webEnvironment=RANDOM_PORT), so parallel CI runs never collide.
server.port=8080
