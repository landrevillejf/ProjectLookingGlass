# wonderland-server (M3b): the session/host server binds real ports here.
# The Spring Boot lifecycle (WonderlandServerApplication) owns embedded Tomcat,
# so a plain `bootRun`/executable jar serves:
#   - the REST world surface (WorldRestController) at http://<host>:<port>/api/world
#   - the wire-protocol WebSocket endpoint (CommsWebSocketHandler, M1 codec) at
#     ws://<host>:<port>/comms
# The port is overridable with SERVER_PORT / -Dserver.port. Tests do NOT rely on
# this file: they boot the same context on a random free port
# (@SpringBootTest webEnvironment=RANDOM_PORT), so parallel CI runs never collide.
server.port=8080

# World seeding is opt-in and OFF by default so an empty server still boots and
# the M3b socket test (which asserts an empty world) is unaffected. To serve a
# world, name its module -- e.g.
#   ./gradlew :wonderland-server:bootRun --args='--wonderland.world.seed=wonderland-outpatient-clinic'
# The seed names either a bundled classpath module (the outpatient clinic, read
# through ManifestClasspathWorldStore) or a world jar in the directory below
# (read through JarWorldStore); a world that fails to load degrades to an empty
# server, never a boot failure.
wonderland.world.seed=none

# Where installed world module jars live -- the stock Open Wonderland worlds
# (almostempty, auditorium, combined, gallery, japanesepavilion, meetingcomplex,
# town) extracted from the installer by :wonderland-server:extractWorlds. Blank
# (the default) means "no directory": the catalog then lists only the bundled
# classpath worlds. Point it at a folder of *-world.jar files and each appears in
# GET /api/world/worlds and becomes seedable by its file-stem module name.
#   ./gradlew :wonderland-server:bootRun --args='--wonderland.world.dir=wonderland-worlds'
wonderland.world.dir=

# Snapshot autosave (roadmap P5.4) is opt-in and OFF by default: the world
# re-seeds from its module art every boot and forgets where a person slid a
# chair, unless this names a file. When set, the server restores cell
# placements from it on boot and rewrites it whenever the world changes and a
# quiet interval has passed (a failure to write is logged and retried, never
# fatal). Blank (the default) means no restore, no scheduled beat, no file --
# exactly the pre-P5.4 server.
#   ./gradlew :wonderland-server:bootRun --args='--wonderland.server.snapshot.path=/var/lib/wonderland/world.snapshot'
wonderland.server.snapshot.path=

# How often (ms) the autosave wakes, and the quiet interval it waits after the
# last change before writing -- one number serves both, so a busy world is
# coalesced to at most one write per interval.
wonderland.server.snapshot.interval=30000

# Login gate (roadmap P5.4) is OFF by default so a developer's loopback bootRun
# and every existing integration test see the anonymous username-from-attach
# path byte-for-byte. When enabled, every FIRST-channel attach must carry a
# valid HMAC token in its properties (key "token"); a missing, forged or
# foreign-secret token closes the socket with POLICY_VIOLATION before a session
# is minted. Follow-on channels (those echoing a known session id) skip the
# gate because the gate already decided when the session was created.
# Set the secret to a unique per-deployment string (never a source constant).
#   ./gradlew :wonderland-server:bootRun --args='--wonderland.server.auth.enabled=true --wonderland.server.auth.secret=<your-key>'
wonderland.server.auth.enabled=false
wonderland.server.auth.secret=
