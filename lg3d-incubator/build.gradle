// lg3d-incubator: a grab-bag of independent experimental LG3D applications.
//
// Ported from the 2006-era Ant build (lg3d-incubator/build.xml). The legacy
// build was a meta-target that ran a per-app subant over src/build-scripts/
// build-*.xml with failonerror="false": each app was compiled and jarred on its
// own, and any app that failed to build was simply skipped without failing the
// overall build.
//
// This Gradle port compiles the whole src/classes tree as one source set against
// lg3d-core plus every bundled ext jar. A handful of apps depend on third-party
// libraries that were never committed to the repository (and are not on Maven
// Central under a compatible coordinate), so they cannot be compiled here -- the
// legacy build silently skipped them too. They are excluded below, grouped by the
// missing dependency:
//
//   * nu/koidelab/** (Cosmo)          - Jini/JavaSpaces (net.jini.*),
//                                       JGL (com.objectspace.jgl), SATIN
//   * apps/archviz3d/**               - XMLBeans-generated schema docs
//                                       (org.candc, org.reqarch3D, org.module,
//                                       org.apache.xmlbeans) and JavaLog
//   * apps/intel3d/**                 - Jini (net.jini.*)
//   * apps/browser/**                 - ICEsoft ICEbrowser (com.icesoft.*) and
//                                       BeanShell (bsh)
//   * apps/browser3d/**               - Jini (net.jini.*)
//
// A second group of apps did not compile against the lg3d-core API snapshot in
// this repository because their sources predate API changes such as
// AppLaunchAction(String,ClassLoader), Pseudo3DShortcut(URL,String,ClassLoader),
// FuzzyEdgePanel.setSize(float,float,float,float), SimpleAppearance.setTexture(URL)
// and the absence of an awt.Color constructor on vecmath Color3f/Color4f. Four
// of them -- luncher, nlc, orgchart and jmf23D -- were small, self-contained
// drift and have been ported to the current API; they now build. Their start-menu
// descriptors live in lg3d-apps/src/config (bundled to config/demo), because
// discovery only scans config/demo and config/incubator while this module's own
// src/config is bundled to config/ -- the same precedent Image Studio follows.
//
// One app in this group remains excluded:
//
//   * apps/wilkoaim3d/**              - deep drift, not a small fix: it targets a
//                                       whole 2004-era lg3d utility vocabulary that
//                                       no longer exists in core (Frame3DToFrontEvent,
//                                       ComponentMover, ResilientRotateAction,
//                                       NaturalMotionComponent3D/Container3D,
//                                       ColorAlphaChangeAction), the obsolete 2-arg
//                                       event-adapter constructors, and setTexture(String).
//                                       Porting it means rewriting a 1277-line prototype
//                                       from scratch -- and its AOL AIM TOC backend was
//                                       discontinued by AOL in Dec 2017, so the app could
//                                       never log in even if rewritten. (Note: the com.wilko
//                                       jaimlib.jar IS present in ext/ and on the classpath;
//                                       the missing dependency was never the real blocker.)
//
// Everything else builds against the Jogamp Java 3D API migrated across the tree.

sourceSets {
    main {
        java {
            srcDir 'src/classes'

            // Apps whose third-party libraries are absent from the repository
            // (see header). Mirrors the legacy per-app failonerror=false skips.
            exclude 'nu/koidelab/**'
            exclude 'org/jdesktop/lg3d/apps/archviz3d/**'
            exclude 'org/jdesktop/lg3d/apps/intel3d/**'
            exclude 'org/jdesktop/lg3d/apps/browser/**'
            exclude 'org/jdesktop/lg3d/apps/browser3d/**'

            // Deep 2004-era core-API drift + a discontinued AOL AIM backend (see
            // header): a from-scratch rewrite that could never run, so it stays out.
            exclude 'org/jdesktop/lg3d/apps/wilkoaim3d/**'
        }
        resources {
            // Images, models, configs and other assets sit alongside the sources.
            srcDir 'src/classes'
            exclude '**/*.java'
        }
    }
    test {
        java {
            srcDir 'src/test/java'
        }
    }
}

// The desktop app descriptors under src/config are bundled at the jar root.
processResources {
    from('src/config') {
        into 'config'
    }
}

jar {
    archiveBaseName = 'lg3d-incubator'
    zip64 = true
}

dependencies {
    implementation project(':lg3d-core')

    // Bundled third-party jars (axis, jai, jmf, jxta, log4j, prefuse,
    // svgSalamander, nanoxml, jl, jpedal, mail/activation, bouncycastle, ...).
    implementation fileTree(dir: 'ext', include: '**/*.jar')

    // Agenda 3D marks business days / holidays / weekends in its week grid via
    // the bundled jbusinessday library (repo-root libs/, not a module ext jar).
    implementation files("${rootProject.projectDir}/libs/jbusinessday-0.9.1-SNAPSHOT.jar")

    // jbusinessday logs through slf4j and its holiday utilities touch
    // org.slf4j.LoggerFactory in a static initializer, so slf4j-api MUST be on
    // the runtime classpath or the library dies with NoClassDefFoundError the
    // first time a holiday list is built. slf4j-nop is a silent no-op provider:
    // the desktop has no interest in jbusinessday's internal logs, and binding
    // NOP avoids the "no SLF4J providers were found" startup warning.
    runtimeOnly libs.slf4j.api
    runtimeOnly libs.slf4j.nop

    // Unit tests for the Java 3D-free Swing panels that back the Office and
    // Games apps in the 2D/Swing desktop (MailPanel, AgendaPanel,
    // ContactCardsPanel, ChartPanel, TicTacToePanel, SudokuPanel, ChessPanel,
    // SolitairePanel). They reuse the apps' AWT-free models, engines and
    // Preferences stores, so they are exercised headless (a JPanel needs no X
    // display).
    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.platform.launcher
}

tasks.named('test') {
    useJUnitPlatform()
    // The panels are plain Swing; run headless so CI (no X display) does not
    // fail on the JPanel/JTextField/JButton/JTree the tests build.
    systemProperty 'java.awt.headless', 'true'
    // The bundled ext/axis/xercesImpl.jar is an ancient Xerces that registers
    // itself as the JAXP DocumentBuilderFactory (via META-INF/services) and
    // references org.w3c.dom.ls.DocumentLS, a class long removed from the JDK.
    // Because the java.xml module owns the org.w3c.dom.ls package, a classpath
    // jar cannot also supply it (split package), so java.util.prefs -- which
    // ContactDirectory/ChartPanel drive through importPreferences to seed
    // /contacts from contacts.xml -- dies with NoClassDefFoundError. The
    // :lg3d-core run classpath already omits this jar for the same reason; the
    // `implementation fileTree(ext)` above pulls it back onto the *test*
    // runtime classpath, so drop it here to keep the platform XML parser intact.
    classpath = classpath.filter { !it.name.equals('xercesImpl.jar') }
}

// ---------------------------------------------------------------------------
// PIT mutation testing (report-only, on-demand)
// ---------------------------------------------------------------------------
// AGENTS.md calls 0 surviving mutants mandatory; PIT makes that measurable. It
// is NOT part of `build`/`check` (mutation analysis is slow), so run it
// explicitly: `./gradlew :lg3d-incubator:pitest`. mutationThreshold=0 means
// surviving mutants never fail the build; the report under
// build-gradle/reports/pitest shows which mutants the tests catch.
apply plugin: 'info.solidsoft.pitest'
pitest {
    pitestVersion = libs.versions.pitest.get()
    junit5PluginVersion = libs.versions.pitestJunit5.get()
    threads = 4
    outputFormats = ['HTML', 'XML']
    mutationThreshold = 0
    timestampedReports = false
    // Do not mutate into GUI calls: they cannot run headless inside a mutation
    // sandbox and would only produce spurious "killed by error" noise.
    avoidCallsTo = ['java.awt', 'javax.swing']
}
