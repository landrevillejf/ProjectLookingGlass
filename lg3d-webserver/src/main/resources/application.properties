# lg3d-webserver: a self-contained Spring Boot (embedded Tomcat) web server that
# hosts and supervises containerized Spring Boot applications. The Spring Boot
# lifecycle (WebServerApplication) owns embedded Tomcat, so a plain
# `bootRun`/executable jar serves:
#   - the management REST API (ServerManagementController) at
#     http://<host>:<port>/api/server/health, /api/server/info, /api/server/metrics
#     and /api/apps (list/deploy/get/logs/start/stop/undeploy)
#   - a reverse proxy (ReverseProxyFilter) that publishes each running app under
#     http://<host>:<port>/<contextPath>/...
# The port is overridable with SERVER_PORT / -Dserver.port. Tests do NOT rely on
# this file: they boot the same context on a random free port
# (@SpringBootTest webEnvironment=RANDOM_PORT) and pin webserver.deploy-dir to a
# temp folder, so parallel CI runs never collide and never touch ~/.lg3d.
server.port=8080

# Management bearer token. Blank (the default) leaves /api/** open on loopback for
# development, exactly like wonderland-server's login gate. Set it to a unique
# per-deployment secret (never a source constant) to require
# `Authorization: Bearer <token>` on every /api/** call; a missing or wrong token
# is answered with a 401. The reverse-proxied app paths are not gated here.
#   ./gradlew :lg3d-webserver:bootRun --args='--webserver.management-token=<your-secret>'
webserver.management-token=

# Where the deployment table (deployments.json) is persisted. Blank (the default)
# means ~/.lg3d/webserver, overridable with the -Dlg3d.webserver.dir system
# property (which the tests use to point at a temp dir). Reads are forgiving and
# writes are best effort, so an unwritable location degrades instead of failing.
#   ./gradlew :lg3d-webserver:bootRun --args='--webserver.deploy-dir=/var/lib/lg3d/webserver'
webserver.deploy-dir=

# Whether the Docker deployment backend is offered at all. When false, Docker
# deploys are refused with a readable message and health reports
# dockerAvailable=false even if a daemon is present; the local JAR backend still
# works. A true value still degrades to dockerAvailable=false when no daemon
# answers a probe, so the server boots fine on a Docker-less host.
#   ./gradlew :lg3d-webserver:bootRun --args='--webserver.docker-enabled=false'
webserver.docker-enabled=true

# Whether the reverse proxy publishes running apps under /<contextPath>/**. When
# false, only the direct published port reaches an app and the proxy falls through
# to normal handling.
#   ./gradlew :lg3d-webserver:bootRun --args='--webserver.proxy-enabled=false'
webserver.proxy-enabled=true

# Host name used when the API reports an application's public URL (AppView.url).
# Purely cosmetic -- the proxy always connects to the app on localhost -- so set
# it to the machine's LAN name to hand out clickable URLs. Blank falls back to
# "localhost".
#   ./gradlew :lg3d-webserver:bootRun --args='--webserver.public-host=desktop.local'
webserver.public-host=localhost

# The inclusive host-port range auto-assigned to a deployment that does not name a
# port. The chosen port is published by Docker (-p port:port) and passed to a
# forked jar (--server.port=port), so it is free on the host and unique per app.
#   ./gradlew :lg3d-webserver:bootRun --args='--webserver.port-range.start=9100 --webserver.port-range.end=9199'
webserver.port-range.start=9001
webserver.port-range.end=9099

# How often (ms) the registry reconciles recorded state against the live backend,
# so a container that died outside the API is reported stopped without a client
# having to poll. Also applied lazily on every list/get.
#   ./gradlew :lg3d-webserver:bootRun --args='--webserver.reconcile-interval-ms=30000'
webserver.reconcile-interval-ms=15000
