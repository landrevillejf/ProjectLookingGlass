plugins {
    id 'java-library'
    id 'application'
    id 'jacoco'
}

group = 'org.jdesktop'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // JNA for native PTY support (forkpty/openpty via libc)
    implementation 'net.java.dev.jna:jna:5.14.0'
    implementation 'net.java.dev.jna:jna-platform:5.14.0'
    
    // Testing
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'org.jdesktop.terminal.Standalone'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy 'jacocoTestReport'
}

tasks.named('jacocoTestReport') {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

// No coverage rule here, on purpose. An earlier revision of this file configured
// jacocoTestCoverageVerification with `minimum = 0.80` and made `check` depend on
// it, which read as an 80% coverage gate and was nothing: this module has no
// src/test/java at all, so `test` is NO-SOURCE, no .exec file is ever written,
// and JaCoCo skips the verification task with "missing execution data file".
// A rule that cannot fire is not a gate, it is a claim. The module's 19 classes
// (3.6k lines: the emulator, scrollback, cell/attribute model, alternate screen,
// audit log, plus the JNA PTY layer) are untested, and that is now said out loud
// in scripts/mandela/coverage-floors.mnd's NO_SUITE list, which is checked in both
// directions: every module with no test source must be named there, and an entry
// whose module has grown a suite must be deleted -- so the debt is enumerated
// rather than absent, and the list shrinks when the first suite lands. Until it
// does, neither jacocoTestCoverageVerification nor pitest is applied to this
// module at all, and AGENTS.md says so in the same breath as its 100% rule.

// Encoding
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Jar configuration
jar {
    manifest {
        attributes(
            'Implementation-Title': 'LG3D Terminal',
            'Implementation-Version': project.version,
            'Main-Class': 'org.jdesktop.terminal.Standalone'
        )
    }
}
