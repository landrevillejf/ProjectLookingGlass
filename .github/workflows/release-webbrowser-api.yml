name: Release Web Browser API

# Publishes ONLY the Web Browser extension API jar -- the small, standalone
# org.jdesktop.lg3d.apps.webbrowser.ext SPI + value types that third-party
# extension developers compile against (see docs/webbrowser-extensions.md) -- as
# its own dedicated GitHub Release. It is deliberately independent of the
# desktop-bundle release (release.yml, which fires on a `v*` tag and publishes
# lg3d-<version>.zip + version.json): this workflow builds one artifact and
# nothing else, on demand.
#
# Trigger: manual (workflow_dispatch) only. Each run creates (or updates) a
# release tagged webbrowser-api-v<version>. That namespace does NOT match
# release.yml's `v*` glob, so publishing the API jar never fires the desktop
# release and vice-versa. Because the run creates its own tag + Release in-run
# (it does not rely on a tag-push hand-off), the default GITHUB_TOKEN with
# `contents: write` is sufficient -- no RELEASE_PAT is needed here.
#
# Assets published to the release:
#   - lg3d-webbrowser-ext-api-<version>.jar           (the API)
#   - lg3d-webbrowser-ext-api-<version>-sources.jar   (sources, for IDEs)
#   - SHA256SUMS.txt                                  (checksums for both)
#
# The jar contents are defined by the :lg3d-apps:webBrowserApiJar task: the ext
# SPI + value types, EXCLUDING the browser's internal runtime
# (ExtensionRegistry / ExtensionBroker / ExtensionState) and the ext/builtin
# reference implementations.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'API jar version (blank = the checked-out build.gradle version, e.g. 1.60.0-dev)'
        required: false
        type: string
      prerelease:
        description: 'Mark the release a pre-release (auto-set for a -dev/-rc/-alpha/-beta version)'
        required: false
        type: boolean
        default: false

permissions:
  # Create the webbrowser-api-v<version> tag + Release and upload assets to it.
  contents: write

# Do not cancel an in-flight publish: a half-uploaded release is worse than a
# slightly delayed one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-api-jar:
    name: Build & publish the Web Browser extension API jar
    # The API jar is pure Java (no natives, no JavaFX at build time); building it
    # headless on Linux matches build.yml / release.yml.
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build the API jar + sources jar
        id: build
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION:-}" ]; then
            VERSION="$INPUT_VERSION"
            ./gradlew :lg3d-apps:webBrowserApiJar :lg3d-apps:webBrowserApiSourcesJar \
              -PreleaseVersion="$VERSION" --stacktrace
          else
            ./gradlew :lg3d-apps:webBrowserApiJar :lg3d-apps:webBrowserApiSourcesJar --stacktrace
            # No explicit version: derive it from the produced jar name
            # (lg3d-webbrowser-ext-api-<version>.jar), which the task stamped
            # with the canonical project.version.
            JAR="$(ls lg3d-apps/build-gradle/libs/lg3d-webbrowser-ext-api-*.jar \
                     | grep -v -- '-sources\.jar$' | head -1)"
            BASE="$(basename "$JAR")"
            VERSION="${BASE#lg3d-webbrowser-ext-api-}"
            VERSION="${VERSION%.jar}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Built the Web Browser extension API jar for version $VERSION"

      - name: Stage assets + checksums
        env:
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          set -euo pipefail
          STAGING="$(pwd)/release-assets"; mkdir -p "$STAGING"
          LIBS="lg3d-apps/build-gradle/libs"
          BIN="lg3d-webbrowser-ext-api-${VERSION}.jar"
          SRC="lg3d-webbrowser-ext-api-${VERSION}-sources.jar"
          test -f "$LIBS/$BIN" || { echo "ERROR: missing $LIBS/$BIN" >&2; exit 1; }
          test -f "$LIBS/$SRC" || { echo "ERROR: missing $LIBS/$SRC" >&2; exit 1; }
          cp "$LIBS/$BIN" "$LIBS/$SRC" "$STAGING/"
          # Checksums carry bare file names (computed from inside the staging dir)
          # so a consumer can `sha256sum -c SHA256SUMS.txt` beside the jars.
          ( cd "$STAGING" && sha256sum "$BIN" "$SRC" > SHA256SUMS.txt )
          echo "--- staged assets ---"; ls -l "$STAGING"; echo; cat "$STAGING/SHA256SUMS.txt"

      - name: Publish to the dedicated GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.build.outputs.version }}
          PRERELEASE_INPUT: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          STAGING="$(pwd)/release-assets"
          TAG="webbrowser-api-v${VERSION}"
          # A -dev/-rc/-alpha/-beta version is a pre-release by nature; honour the
          # explicit input too. Pre-releases never become releases/latest, so this
          # API-jar line cannot hijack the desktop release's `latest` redirect.
          PRE_FLAG=()
          IS_PRE=false
          case "$VERSION" in
            *-dev|*-rc*|*-RC*|*-alpha*|*-beta*) IS_PRE=true ;;
          esac
          if [ "${PRERELEASE_INPUT:-false}" = "true" ]; then IS_PRE=true; fi
          if [ "$IS_PRE" = "true" ]; then
            PRE_FLAG=(--prerelease)
            TITLE="Web Browser extension API ${VERSION} (pre-release)"
          else
            TITLE="Web Browser extension API ${VERSION}"
          fi
          # Release notes: a quoted heredoc keeps the Markdown backticks literal
          # (an unquoted one would treat them as command substitution); the
          # __VERSION__ / __REPO__ placeholders are filled in afterwards.
          cat > "$STAGING/NOTES.md" <<'NOTES'
          Standalone **Web Browser extension API** jar (`org.jdesktop.lg3d.apps.webbrowser.ext`).

          Extension developers compile against this jar (`compileOnly`) instead of the whole
          `lg3d-apps`. It contains only the SPI (`BrowserExtension`) and its immutable value
          types -- **not** the browser's internal runtime (`ExtensionRegistry` /
          `ExtensionBroker` / `ExtensionState`) and **not** the built-in reference extensions
          (`ext.builtin`).

          | Asset | Contents |
          | --- | --- |
          | `lg3d-webbrowser-ext-api-__VERSION__.jar` | the compiled API |
          | `lg3d-webbrowser-ext-api-__VERSION__-sources.jar` | the API sources |
          | `SHA256SUMS.txt` | checksums for both |

          Guide: [docs/webbrowser-extensions.md](https://github.com/__REPO__/blob/main/docs/webbrowser-extensions.md)
          NOTES
          # Fill the placeholders. (The YAML block scalar already stripped the
          # heredoc's indentation, so the notes need no de-indenting here.)
          sed -i "s/__VERSION__/${VERSION}/g; s#__REPO__#${GITHUB_REPOSITORY}#g" "$STAGING/NOTES.md"
          # Create the release (+ its tag at this commit) only if absent, so a
          # re-run is idempotent; --clobber replaces same-named assets.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TITLE" --notes-file "$STAGING/NOTES.md" \
              "${PRE_FLAG[@]}" --target "$GITHUB_SHA"
          fi
          gh release upload "$TAG" --clobber \
            "$STAGING/lg3d-webbrowser-ext-api-${VERSION}.jar" \
            "$STAGING/lg3d-webbrowser-ext-api-${VERSION}-sources.jar" \
            "$STAGING/SHA256SUMS.txt"
          echo "Published $TAG (prerelease=${IS_PRE}):"
          gh release view "$TAG" --json tagName,url,isPrerelease,assets \
            --jq '{tagName,url,isPrerelease,assets:[.assets[].name]}'
