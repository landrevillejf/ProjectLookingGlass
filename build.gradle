        'wonderland-client' : [line: 0.980, branch: 0.955],  // measured 98.58% / 96.91% on the P4.1 mixer-seam fix (was 98.39% / 96.51% on a sound-card dev box -- the divergence was the device-bound clip path CI never ran) (was 98.37% / 95.77% before the physical-kernel suites; M2a shipped the cell leaf as interfaces + annotations -- only CellCreationException carried lines. M2b added the selection registry + comms response substrate. M2c lands the Cell base class + its closure headless (seams: MessageChannel, the static renderer-type holder, Cell.class.getClassLoader()). M2d lands the cell cache registry, the pure CellStatistics layer and EnvironmentCell. M2e lands the connection/session layer: BaseConnection's status pair, "Not connected" guard and request-reply routing; the three cell connections -- hierarchy fan-out into the cache, the delivery demultiplexer with its queue-before-receiver race, FINE-traced delay queue and scheduled unload drop, and the typed edit channel making the M2d MessageSink seam real; ChannelComponent making the M2c MessageChannel seam the loaded cell's actual channel; and the CellClientSession wiring hub driven by an in-JVM loopback WonderlandSession (the M3 endpoint's stand-in) -- 53 new headless cases. M2f lands the view/avatar movement core headless: Throttle (with the 2006 quirk that clear() cannot cancel the pending task -- the ScheduledFuture is never stored), MovableComponent (throttled request, echo suppression by sender identity, LOCAL/REMOTE apply, move-modified and error reply paths; the @UsesCellComponent injection is a documented seam -- the channel resolves from cell.getChannel() at the ACTIVE rung), MovableAvatarComponent (trigger payload, UNthrottled trigger path, "Not supported" modified-listener), ViewCell + LocalAvatar (the session owns its avatar; viewCellConfigured fires across the ACTIVE/INACTIVE rungs) + the AvatarCell headless shell (createCellRenderer returns null -- the client/jme AvatarJME stack is rebuilt at 