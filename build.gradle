// Root build for the LG3D (Project Looking Glass) modernization port.
// Targets JDK 21 + Gradle, replacing the original 2006-era Ant/source-1.5 build.

// Third-party build-analysis plugins, resolved from the version catalog and
// declared `apply false` here so their versions are managed once; each is
// enabled per module below. They are report-only / on-demand and never wired
// into the default `build` in a way that can red-line it (see each section).
plugins {
    alias(libs.plugins.cyclonedx) apply false
    alias(libs.plugins.pitest) apply false
    alias(libs.plugins.dependencyCheck) apply false
    alias(libs.plugins.sonarqube) apply false
    // Applied by wonderland-server only, so `bootRun`/`bootJar` exist for a
    // runnable, configurable server (see that module). apply false here just
    // puts it on the classpath with its version managed once.
    alias(libs.plugins.springboot) apply false
}

allprojects {
    group = 'org.jdesktop.lg3d'
    version = '1.69.0-dev'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java-library'
    // Test coverage measurement for the modules with test suites (lg3d-core,
    // lg3d-widgets). Configured in the jacoco block at the end of this section.
    apply plugin: 'jacoco'
    // Report-only static analysis + SBOM + quality analysis. Checkstyle runs
    // inside `check` with ignoreFailures=false (a violation fails the build);
    // CycloneDX writes a manifest on demand. SonarQube is configured but not
    // yet wired into `check` (needs the server URL).
    apply plugin: 'checkstyle'
    apply plugin: 'org.cyclonedx.bom'

    // Legacy modules ship their own 'build'/'clean' scripts (e.g. lg3d-escher),
    // so keep Gradle output in a separate directory to avoid clobbering them.
    layout.buildDirectory.set(file("$projectDir/build-gradle"))

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        if (name.toLowerCase().contains('test')) {
            // New / test code is held to a higher bar: surface real warnings.
            // No -Werror, so this informs the developer without failing build.
            options.compilerArgs << '-Xlint:all,-options,-path,-serial,-processing'
        } else {
            // The legacy main sources are extremely noisy under a modern
            // compiler (thousands of deprecation/unchecked/rawtypes warnings),
            // so they stay suppressed. AUDIT.md "Deferred" tracks re-enabling
            // -Xlint selectively as regions are modernized.
            options.compilerArgs << '-nowarn'
        }
    }

    tasks.withType(Jar).configureEach {
        // Preserve legacy behaviour: do not compress by default.
        zip64 = true
    }

    // -------------------------------------------------------------------------
    // Test coverage (JaCoCo)
    // -------------------------------------------------------------------------
    // AGENTS.md sets 100% line/branch coverage as the eventual goal. As a first
    // step the reports are now generated (HTML + XML) after every test run, so
    // `build` and CI actually surface coverage instead of leaving it "Unknown
    // (not measured)". No failing verification threshold is wired in yet: the
    // ported codebase is ~200k lines with a small Java-3D-free test suite, so a
    // hard gate would red-line every build. Layer jacocoTestCoverageVerification
    // onto individual modules as their coverage becomes meaningful.
    tasks.withType(Test).configureEach {
        // Deterministic i18n baseline: shell labels resolve through the run's
        // language at class-load time, so suites that assert the English
        // literals pin the desktop locale to en here (a test that wants
        // French sets the lg.locale sysprop itself and resets LgLocale).
        systemProperty 'lg.locale', 'en'
        finalizedBy 'jacocoTestReport'
    }
    tasks.withType(JacocoReport).configureEach {
        reports {
            xml.required = true    // machine-readable; uploaded as a CI artifact
            html.required = true   // human-readable browsable report
        }
    }

    // -------------------------------------------------------------------------
    // Coverage exemptions (JaCoCo verification)
    // -------------------------------------------------------------------------
    // AGENTS.md sets 100% line/branch coverage as the goal, and the rule is
    // enforced rather than announced: EVERY module with a test suite is held to
    // 100% unless it appears in the coverageExemptions map below, where it must
    // carry its measured ratio AND a reason in exemptionReasons. A module in the
    // map is allowed to sit at its measured maximum achievable ratio; a
    // regression below that ratio fails `check`. A module with no test source is
    // the one case a ratio cannot describe (there is nothing to cover and
    // jacocoTestCoverageVerification would run on no execution data), so it gets
    // no rule and instead has to be named in scripts/mandela/coverage-floors.mnd's
    // no-suite list. Raise a module's ratio as coverage improves; delete its
    // entry once it reaches 100% -- an entry that stops being needed is a finding.
    def coverageExemptions = [
        'lg3d-apps'     : [line: 0.400, branch: 0.350],  // measured 40% line (the Swing app panels are probe-verified; the pure logic classes are higher)
        'lg3d-core'     : [line: 0.225, branch: 0.310],  // measured 22.83% / 31.56% (the displayserver.crash package is at 92.43% line / 82.16% branch - 123 headless tests; the rest is the 2006-era scene graph, which needs a live 3D desktop)
        'lg3d-widgets'  : [line: 0.480, branch: 0.400],  // measured 50.11% / 41.64%
        'lg3d-incubator': [line: 0.005, branch: 0.005],  // measured 0.63% / 0.72% (only the Office + Games Java 3D-free Swing panels are exercised; the ~184k-line 3D app tree is untested, but each panel is ~78-100% line-covered)
        'lpm-console'   : [line: 0.240, branch: 0.300],  // measured 26.7% / 36.9% (logic classes ~100%; the 853-line Swing panel is probe-verified)
        'update-manager': [line: 0.595, branch: 0.560],  // measured 60.29% / 56.86% (was 56.35% / 51.54% before the changelog reader learned this repository's own Keep a Changelog vocabulary - the whole of ChangelogManager's parse and inline-markdown path is now driven by 28 cases, and the rest of the module is the Swing ui + download layers that want a live desktop)
        'db-manager'    : [line: 0.620, branch: 0.570],  // measured 63.36% / 58.51% (model+jdbc+session ~full via real H2/SQLite; the Swing ui layer is construction/probe-tested)
        'ftp-client'    : [line: 0.600, branch: 0.520],  // measured 61.96% / 54.84% (model+net+session ~full via in-JVM MockFtpServer + mocked JSch; the Swing ui layer is construction/probe-tested)
        'lg3d-webserver': [line: 0.985, branch: 0.975],  // measured 99.02-99.16% / 98.10% (the line figure moves with whether RealProcessLauncher's gobble-IOException race is hit on a given run; the floor sits under both ends) (the Spring Boot management server that deploys containerized Spring Boot apps via the system docker CLI and forks local bootJars -- built as an executable bootJar and, like wonderland-server, deliberately absent from the desktop classpath: the console reaches it over HTTP and as a child process. The pure core is driven headless with no daemon, no display and no real fork: DeploymentRegistry (id/name/context-path/port assignment so two deploys never collide, failure-kind separation, reconcile-back-to-STOPPED, JSON persistence across instances) over FakeDockerCli + FakeChildProcessStarter -- now at every line and every branch, its defensive catch arms reached by a fault-injecting StubBackend (a deploy/start/stop/remove/isRunning that throws DeploymentException vs RuntimeException), an orphan registry whose persisted app has no backend, and hand-derived blank/null name/image/jarPath/contextPath inputs; DockerDeploymentBackend's exact argv + start->run fallback + no-daemon degradation + fail()/firstNonBlank() detail fallbacks (blank, negative-exit and null streams); JarProcessBackend's fork/track/tail/stop; ReverseProxyFilter's longest-prefix routing and real forwarding against an in-JVM com.sun.net.httpserver (502 on an unreachable app, on an interrupt, and skipped on a committed response; hop-by-hop and null header names dropped; empty upstream body; empty query; HEAD without a body); the standalone-MockMvc management API over every endpoint; ManagementAuthGate's constant-time bearer gate; the real RealProcessLauncher/RealChildProcessStarter interrupt, bounded-window and SIGTERM-escalation paths over genuine short-lived children; and a @SpringBootTest(RANDOM_PORT) context that boots with docker disabled and proves health/info/400/503 end to en