// Root build for the LG3D (Project Looking Glass) modernization port.
// Targets JDK 21 + Gradle, replacing the original 2006-era Ant/source-1.5 build.

// Third-party build-analysis plugins, resolved from the version catalog and
// declared `apply false` here so their versions are managed once; each is
// enabled per module below. They are report-only / on-demand and never wired
// into the default `build` in a way that can red-line it (see each section).
plugins {
    alias(libs.plugins.cyclonedx) apply false
    alias(libs.plugins.pitest) apply false
    alias(libs.plugins.dependencyCheck) apply false
    // Applied by wonderland-server only, so `bootRun`/`bootJar` exist for a
    // runnable, configurable server (see that module). apply false here just
    // puts it on the classpath with its version managed once.
    alias(libs.plugins.springboot) apply false
}

allprojects {
    group = 'org.jdesktop.lg3d'
    version = '1.69.0-dev'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java-library'
    // Test coverage measurement for the modules with test suites (lg3d-core,
    // lg3d-widgets). Configured in the jacoco block at the end of this section.
    apply plugin: 'jacoco'
    // Report-only static analysis + SBOM. Checkstyle runs with ignoreFailures
    // (configured below); CycloneDX writes a manifest on demand. Neither is
    // wired to fail `build`.
    apply plugin: 'checkstyle'
    apply plugin: 'org.cyclonedx.bom'

    // Legacy modules ship their own 'build'/'clean' scripts (e.g. lg3d-escher),
    // so keep Gradle output in a separate directory to avoid clobbering them.
    layout.buildDirectory.set(file("$projectDir/build-gradle"))

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        if (name.toLowerCase().contains('test')) {
            // New / test code is held to a higher bar: surface real warnings.
            // No -Werror, so this informs the developer without failing build.
            options.compilerArgs << '-Xlint:all,-options,-path,-serial,-processing'
        } else {
            // The legacy main sources are extremely noisy under a modern
            // compiler (thousands of deprecation/unchecked/rawtypes warnings),
            // so they stay suppressed. AUDIT.md "Deferred" tracks re-enabling
            // -Xlint selectively as regions are modernized.
            options.compilerArgs << '-nowarn'
        }
    }

    tasks.withType(Jar).configureEach {
        // Preserve legacy behaviour: do not compress by default.
        zip64 = true
    }

    // -------------------------------------------------------------------------
    // Test coverage (JaCoCo)
    // -------------------------------------------------------------------------
    // AGENTS.md sets 100% line/branch coverage as the eventual goal. As a first
    // step the reports are now generated (HTML + XML) after every test run, so
    // `build` and CI actually surface coverage instead of leaving it "Unknown
    // (not measured)". No failing verification threshold is wired in yet: the
    // ported codebase is ~200k lines with a small Java-3D-free test suite, so a
    // hard gate would red-line every build. Layer jacocoTestCoverageVerification
    // onto individual modules as their coverage becomes meaningful.
    tasks.withType(Test).configureEach {
        // Deterministic i18n baseline: shell labels resolve through the run's
        // language at class-load time, so suites that assert the English
        // literals pin the desktop locale to en here (a test that wants
        // French sets the lg.locale sysprop itself and resets LgLocale).
        systemProperty 'lg.locale', 'en'
        finalizedBy 'jacocoTestReport'
    }
    tasks.withType(JacocoReport).configureEach {
        reports {
            xml.required = true    // machine-readable; uploaded as a CI artifact
            html.required = true   // human-readable browsable report
        }
    }

    // -------------------------------------------------------------------------
    // Coverage ratchet (JaCoCo verification)
    // -------------------------------------------------------------------------
    // AGENTS.md sets 100% coverage as the eventual goal, but a hard 100% gate on
    // this ~200k-line port (core ~23% line, widgets ~40%) would fail every
    // build. Instead each module with a test suite gets a *floor* set just below
    // its current measured coverage: a regression below the floor fails `check`,
    // ordinary churn stays green. Raise a floor as coverage improves. Modules
    // without a test suite get no rule (they would trivially "fail" at 0%).
    def coverageFloors = [
        'lg3d-core'     : [line: 0.225, branch: 0.310],  // measured 22.83% / 31.56% (the displayserver.crash package is at 92.43% line / 82.16% branch - 123 headless tests; the rest is the 2006-era scene graph, which needs a live 3D desktop)
        'lg3d-widgets'  : [line: 0.480, branch: 0.400],  // measured 50.11% / 41.64%
        'lg3d-incubator': [line: 0.005, branch: 0.005],  // measured 0.63% / 0.72% (only the Office + Games Java 3D-free Swing panels are exercised; the ~184k-line 3D app tree is untested, but each panel is ~78-100% line-covered)
        'lpm-console'   : [line: 0.240, branch: 0.300],  // measured 26.7% / 36.9% (logic classes ~100%; the 853-line Swing panel is probe-verified)
        'update-manager': [line: 0.595, branch: 0.560],  // measured 60.29% / 56.86% (was 56.35% / 51.54% before the changelog reader learned this repository's own Keep a Changelog vocabulary - the whole of ChangelogManager's parse and inline-markdown path is now driven by 28 cases, and the rest of the module is the Swing ui + download layers that want a live desktop)
        'db-manager'    : [line: 0.620, branch: 0.570],  // measured 63.36% / 58.51% (model+jdbc+session ~full via real H2/SQLite; the Swing ui layer is construction/probe-tested)
        'ftp-client'    : [line: 0.600, branch: 0.520],  // measured 61.96% / 54.84% (model+net+session ~full via in-JVM MockFtpServer + mocked JSch; the Swing ui layer is construction/probe-tested)
        'lg3d-mandela'  : [line: 0.910, branch: 0.815],  // measured 91.49% / 81.86% (JUnit unit suites + Cucumber BDD + the Machine* suites that address the VM in its own instruction set; org.jdesktop.lg3d.mandela.values is at every line covered, rt/StandardLibrary and rt/Json likewise -- 1.1.0's string/list members and the std.glob segment matcher arrived with their branches pinned, including the head-segment bound that a candidate shorter than its pattern exposes and the carriage return that ends a text, both of which a line-only reading of the file would have missed; the language toolchain's goal remains 100% line/branch and 0 surviving mutants per lg3d-mandela/AGENTS.md, and this floor is raised as each package closes)
        'wonderland-common' : [line: 0.300, branch: 0.200],  // measured 32.36% / 21.48% (M0 seed: the com.jme math/bounding shim, Math3DUtils, the CellTransform pipeline through vecmath Matrix4d, and the ChecksumList JAXB round-trip. M1 adds the wire-protocol codec pins: MessagePackerTest + CommsMessagesCodecTest + CellMessagesCodecTest cover every MessageID/Message envelope, the session handshake types, and every cell/{messages,comms/messages,messages} wire class -- 43 new cases on top of M0's 77, all through the Java serialisation + Wonderland class-descriptor-id path that the M3 Spring Boot WebSocket handler will use. The remaining ~65% is the still-untested data-model periphery -- modules, security, jaxb adapters, login -- that each later milestone pulls into scope)
        'wonderland-client' : [line: 0.980, branch: 0.950],  // measured 98.37% / 95.77% (M2a shipped the cell leaf as interfaces + annotations -- only CellCreationException carried lines. M2b added the selection registry + comms response substrate. M2c lands the Cell base class + its closure headless (seams: MessageChannel, the static renderer-type holder, Cell.class.getClassLoader()). M2d lands the cell cache registry, the pure CellStatistics layer and EnvironmentCell. M2e lands the connection/session layer: BaseConnection's status pair, "Not connected" guard and request-reply routing; the three cell connections -- hierarchy fan-out into the cache, the delivery demultiplexer with its queue-before-receiver race, FINE-traced delay queue and scheduled unload drop, and the typed edit channel making the M2d MessageSink seam real; ChannelComponent making the M2c MessageChannel seam the loaded cell's actual channel; and the CellClientSession wiring hub driven by an in-JVM loopback WonderlandSession (the M3 endpoint's stand-in) -- 53 new headless cases. M2f lands the view/avatar movement core headless: Throttle (with the 2006 quirk that clear() cannot cancel the pending task -- the ScheduledFuture is never stored), MovableComponent (throttled request, echo suppression by sender identity, LOCAL/REMOTE apply, move-modified and error reply paths; the @UsesCellComponent injection is a documented seam -- the channel resolves from cell.getChannel() at the ACTIVE rung), MovableAvatarComponent (trigger payload, UNthrottled trigger path, "Not supported" modified-listener), ViewCell + LocalAvatar (the session owns its avatar; viewCellConfigured fires across the ACTIVE/INACTIVE rungs) + the AvatarCell headless shell (createCellRenderer returns null -- the client/jme AvatarJME stack is rebuilt at M6 on lg3d-core's Jogamp bridge, not claimed here), and the restored CellCache.getSession()/setViewCell() with the original's unconditional roots-to-VISIBLE walk pinned as a quirk -- 164 cases total. The only residue now genuinely unreachable in-JVM: Throttle's dead cancel branch, the impossible msgReceiver-without-channelComp DISK combination, and the renderer status walk that wants a live Java 3D canvas -- the floor is raised as each closes.)
        'wonderland-server' : [line: 0.950, branch: 0.840],  // measured 96.30% / 85.00% (M3a landed the Spring Boot session/host server that replaces the retired GlassFish Embedded + Sun Game Server + MINA + JAX-RS stack: SessionRegistry/ServerSession, WorldModel/WorldCell, ProtocolRouter (SET_VIEW handshake, view-cell registration + the deferred post-reply flush reproducing the 2006 async socket ordering, LOAD fan-out, authoritative move reply + senderID-stamped broadcast, reparent->CONFIGURE, corrupt-frame rejection), the REST world controller and the @SpringBootTest context wiring. M3b lifts the "a socket owns its session" note: CommsWebSocketHandler now converges a client's THREE cell sockets (cache/channel/edit) onto ONE ServerSession via the SESSION_ID_KEY attach property, dispatches each ConnectionType's frame to the right socket through a shared FrameSink, and tears the session down only when its last channel closes; application.properties binds /comms + /api/world on a real embedded-Tomcat port, and a real-socket @SpringBootTest(RANDOM_PORT) + StandardWebSocketClient integration test proves the login handshake, the multi-socket one-session fan-out, a cross-session move over sockets and the REST surface on the same live port -- 17 new cases on top of M3a's 52, the crown LoopbackClientServerTest still driving a REAL wonderland-client CellClientSession over the M1 codec. The residue is defensive transport branches (an IOException socket write, a pack/unpack failure, the stale-session-id attach warning) that want a fault-injection seam, and the branch floor sits a hair under the measured ratio -- raised as each closes.)
        'wonderland-modules' : [line: 0.985, branch: 0.945],  // measured 98.88% / 95.32% (M4 replaced the NetBeans Platform module system + dead scannotation scan with a plain java.util.ServiceLoader plugin loader: WonderlandPlugin / PluginContext bridged to the wonderland-common ModuleInfo + ModuleRequires metadata, and WonderlandPluginLoader doing ServiceLoader discovery, duplicate/missing-name guards, topological ordering so a dependency initialises before its dependents, the skip-and-cascade for an unsatisfiable requirement, the loud PluginCycleException on a cycle, ordered init and reverse-order dispose. It ships the five low-risk modules -- chat, imageviewer, user-list, stickynote, whiteboard -- each a ServiceLoader provider with a fully headless domain model (conversation transcript, image load-status machine, present-user roster, note content, stroke surface + bounds); their Swing / Java 3D presentation is the documented deferred seam M2f used, landing at M6/M7 and NOT claimed here. M5 lands the deployed-asset pipeline in three headless packages: M5a collada (a namespace-safe, entity-refusing DOM reader of COLLADA 1.4.1 -- asset, geometries with source stride/count and the packed-index positions() walk, nodes with every transform folded to a vecmath Matrix4d, the effect/material/image inventory, tolerant numeric coercion, the 2006-era <technique sid="COMMON"> form) proved against the real vendored .dae bytes; M5b artimport (the .dep/.ldr deployed-model and loader-data readers + DeployedTexture/AssetLoadStatus); M5c asset (the wla:// WorldStore abstraction, DirectoryWorldStore with its path confinement, ModelLoader resolving a .dep to a Collada document + present/missing texture inventory with gzip sniffing, and WorldLoader decoding each -wlc.xml to a ModelCellServerState) -- the crown WorldLoaderTest drives the whole chain over the real almost-empty world. M7a adds the videoplayer module -- the JMF (javax.media, unrecoverable) replacement rebuilt on OpenJFX Media behind the MediaSurface seam: VideoTransport (the guarded lifecycle machine -- load/play/pause/stop/seek/setVolume/tick with clamped position+volume and the ENDED walk), Playlist (the wrapping cursor catalog with the remove-current decision) and the VideoPlayerPlugin provider + surface-factory installer slot, all headless-tested; the live JavaFX sink is the lg3d-apps JfxMediaSurface, which cannot be constructed here (JavaFX boots only in the 2D desktop JVM). M7b adds the pdfviewer module -- the jpedal (dead library) replacement rebuilt on Apache PDFBox behind the PageRasterizer seam: PdfViewModel (the pure load-lifecycle + clamped 1-based paging + clamped-zoom machine) and the PdfViewerPlugin provider + rasterizer-factory installer slot, headless-tested; the live PDFBox sink is the lg3d-apps PdfBoxRasterizer adapting the desktop's existing PdfDocument (which runs headless, so its PdfBoxRasterizerTest rasterises real generated PDFs in CI -- 30 cases). M7c adds the COLLADA animation parse to the collada package -- ColladaAnimation keeps the raw <library_animations> vocabulary (sources with float data and the accessor stride under <technique_common>, samplers with hash-stripped INPUT/OUTPUT refs, the interpolation attribute and flat index pairs, channels with the untouched target string) and the Blender group-animation flatten merges child records into the parent; the interpretation deliberately lives in the renderer, so the modules half is 7 more headless cases over real XML. M7d adds the softphone module -- the 2006 VoIP phone that braided three dead technologies (stun.jar NAT lookup, winp process watching, JMF RTP audio) into one bundled closed binary -- as a dependency-free package behind the SoftphoneBackend installer seam: SoftphoneControl (the 2006 state half ported method-for-method, the exitNotificationSent once-rule included), SoftphoneCommand / SoftphoneEvent (the SAME stdin/stdout line vocabulary the 2006 binary spoke, typed), RtpPacket (the RFC 3550 fixed header as a pure value class), G711 (the public-domain mu-law quantiser, exhaustively tested over all 65536 shorts), JitterBuffer (the modulo-2^16 de-jitter reorder with its drop counters), VuMeter + AudioQuality + the listener triad + NoopSoftphoneBackend -- 88 headless cases; the live sinks (ExternalSoftphoneBackend on ProcessHandle, Ice4jNatProbe on ice4j, JavaSoundVoiceBridge on Java Sound) are lg3d-apps' own, and the probe halves that need a process / a STUN server / a sound card are verified live, never claimed here. The residue is a fixed set of defensive branches genuinely unreachable in-JVM -- the I/O-fault catches in ModelLoader.readAll / DirectoryWorldStore.open / listAssets, the JAXBException and ParserConfigurationException guards, the non-namespace-aware local() fallback in both DOM readers, the ColladaTransform switch default and the geometry stride==0 / short-<p> guards that COLLADA's input-offset invariant makes dead -- plus the M4 ServiceLoader ServiceConfigurationError catch and the dispose guard's already-seen path, plus M7d's two probed-to-the-limit singles -- the loop-exhaust exit of trailingInts (the "Softphone exited" / "softphoneTestUDPPort" prefix words always break the backward scan first, so the no-catch path cannot occur on a well-formed line) and one short-circuit side of the pause guard's three-term || (every term's true AND false outcome is exercised, yet JaCoCo still counts one; the floor sits a half-point under the measured 95.32 in deliberate honest margin) -- none reachable without fault injection -- raised as each closes.)
        'wonderland-renderer' : [line: 0.660, branch: 0.660],  // measured 0.669 line / 0.670 branch (M7c; was 0.554 / 0.593 at M6a), floor set a shade under so a small refactor does not immediately break -- the Collada cell renderer rebuilt on org.jogamp.java3d. The pure conversion (ColladaMeshBuilder: mesh sources/inputs/packed <p> -> flat per-primitive triangle-soup vertex/index arrays; WorldTransformMath: node world matrix / CellTransform -> a row-major double[16] Transform3D feed; TextureBindingPlan: material -> effect -> sampler -> image -> present/missing -> colour/texture binding; CellRendererFactory: the RENDERER_JME/NONE dispatch decision) is unit-tested headless. M7c lands the jME-Animator replacement as a pure animation package -- ChannelTarget (the node/sid.element[.ARRAY] vocabulary), KeyframeTrack (right-continuous LINEAR/STEP sampling), AnimationClip (per-node tracks -> Matrix4d pose via Rodrigues), ColladaClips (the raw-to-playable factory: slot model, the stride-4 axis+angle bundle, BEZIER collapse, time normalisation, degrade-never-throw), SyntheticClips (the unrigged idle/walking/waving fallback), AnimationLibrary and AvatarAnimationDirector (loop/gesture/alias policy on an injected clock) -- 70 new cases, the crown AvatarAnimationBundledPoolTest driving the REAL shipped humanoid-a.dae bytes through the whole chain. The probe-only Java 3D assembly (J3dMeshFactory building IndexedTriangleArray/Shape3D/Appearance, ModelRenderer's BranchGroup/TransformGroup live ops, WonderlandModelCell wiring the seam) constructs Jogamp scene-graph objects that cannot be built without a live 3D canvas, so it is verified by the in-JVM probe, not asserted -- exactly the lg3d-core precedent (scene graph uncoverable in CI, floor set for the pure fraction).
        'wonderland-avatars' : [line: 0.950, branch: 0.900],  // M6b: the bundled avatar .dae pool + the AvatarPool catalog that names it. The pure catalog class is small and fully testable (unique names, defaultName() present, every urlFor() resolvable through ClasspathWorldStore); the .dae bodies are resource bytes not code. Floor set at the level a tiny pure class should easily hit.
        'wonderland-desktop' : [line: 0.610, branch: 0.710],  // measured 0.619 line / 0.714 branch (M6c2; was 0.416 / 0.552 at M7c and 0.438 / 0.615 at M6c1): the desktop scene-graph bridge. M6c2 moved the mount/unmount/transform/visibility book-keeping into per-cell Java3DGraph child roots behind the same FrameMounter seam and added the pure routing half -- SessionFeed (the live cell load/unload/transform messages folded into mount decisions), PickRouter + PickDecision + PickIntent (nearest-hit-wins, a cell that is not mounted cannot be picked, gestures the world does not claim), WorldHudModel (the depth-first row walk with the seeded seen-set, the shown/hidden/pending state and the one-line summary) and WorldInputRouter's event-class -> intent mapping -- all headless-tested, which is what lifts the ratio. The residue is genuinely probe-only: WonderlandWorldContainer extends lg3d's Component3D and WonderlandDesktop wires the live Locale/AppConnector bootstrap -- both construct Jogamp scene-graph objects that cannot be built without a running 3D desktop, exactly the wonderland-renderer / lg3d-core precedent (scene graph uncoverable in CI, floor set a shade under the measured pure fraction).
    ]
    def floor = coverageFloors[project.name]
    if (floor != null) {
        tasks.named('jacocoTestCoverageVerification') {
            dependsOn 'test'
            violationRules {
                rule {
                    limit { counter = 'LINE';   value = 'COVEREDRATIO'; minimum = floor.line }
                }
                rule {
                    limit { counter = 'BRANCH'; value = 'COVEREDRATIO'; minimum = floor.branch }
                }
            }
        }
        tasks.named('check') { dependsOn 'jacocoTestCoverageVerification' }
    }

    // -------------------------------------------------------------------------
    // Checkstyle (report-only static analysis)
    // -------------------------------------------------------------------------
    // A single shared, high-signal config lives at config/checkstyle/. The task
    // runs as part of `check` but with ignoreFailures=true, so it publishes an
    // XML+HTML report (uploaded in CI) without ever red-lining the legacy build.
    checkstyle {
        toolVersion = libs.versions.checkstyle.get()
        ignoreFailures = true
        configDirectory = rootProject.file('config/checkstyle')
    }
    tasks.withType(Checkstyle).configureEach {
        reports {
            xml.required = true
            html.required = true
        }
    }

    // -------------------------------------------------------------------------
    // Javadoc -- the source of the published API reference (documentation/en/api)
    // -------------------------------------------------------------------------
    // doclint is off: the ported ~200k-line tree carries 2006-era comment
    // defects (missing @param/@return, raw HTML) by the thousand, and the point
    // of this task here is the published reference, not a comment audit.
    // failOnError is deliberately left TRUE. Setting it false (as an earlier
    // revision did) made `./gradlew javadoc` exit 0 while whole modules emitted
    // an empty tree, which is exactly how five modules silently vanished from
    // the published API. A broken @link is fixed at the source, never by
    // deleting the sentence that carried it.
    // options.links resolves references to JDK types (javax.swing.Icon,
    // java.util.regex.Pattern, ...) to docs.oracle.com instead of rendering
    // them as dead plain text in the published pages.
    tasks.withType(Javadoc).configureEach {
        options.addStringOption('Xdoclint:none', '-quiet')
        options.links = ['https://docs.oracle.com/en/java/javase/21/docs/api/']
    }

    // -------------------------------------------------------------------------
    // CycloneDX SBOM
    // -------------------------------------------------------------------------
    // `cyclonedxBom` writes a machine-readable Software Bill of Materials (exact
    // resolved component versions) per module under build-gradle/reports/; CI
    // uploads it. Addresses the audit's "No SBOM" gap for supply-chain
    // visibility. On-demand only (not wired into build), so it never slows the
    // compile/test path.
}

// -----------------------------------------------------------------------------
// OWASP dependency-check (CVE scanning) - root aggregate, on-demand
// -----------------------------------------------------------------------------
// `./gradlew dependencyCheckAggregate` scans every module's resolved
// dependencies (including the bundled 2006-era incubator jars) against the NVD
// and writes HTML/JSON reports. Report-only: failBuildOnCVSS=11 is above the
// maximum real CVSS score (10), so a finding never fails the build - the point
// is visibility, and the known-vulnerable legacy jars are documented in
// SECURITY.md. NOT part of `build` (the first run downloads the large NVD feed).
// The CI security job runs it on a schedule / main pushes with continue-on-error.
apply plugin: 'org.owasp.dependencycheck'
dependencyCheck {
    failBuildOnCVSS = 11f
    formats = ['HTML', 'JSON']
    // An NVD API key massively speeds the vulnerability-feed download.
    // Optional: pass -PnvdApiKey=KEY or set ORG_GRADLE_PROJECT_nvdApiKey. Guard
    // against an empty value (e.g. an unset CI secret expands to "").
    def nvdKey = project.findProperty('nvdApiKey')?.toString()?.trim()
    if (nvdKey) {
        nvd { apiKey = nvdKey }
    }
}

// -----------------------------------------------------------------------------
// fetchSwingIdeJar: fetch the vendored swing-ide fat jar on demand
// -----------------------------------------------------------------------------
// The IDE start-menu app (lg3d-apps, org.jdesktop.lg3d.apps.swingide) forks the
// external swing-ide project's self-contained fat jar as a separate child
// process. That jar is ~138 MB, above GitHub's 100 MB per-file push limit, so it
// is NOT committed: it is built by the swing-ide project (./gradlew
// :app:shadowJar) and fetched into libs/swing-ide.jar here (libs/swing-ide.jar
// is gitignored). Everything degrades gracefully when it is absent -- the run
// task / release launcher simply point -Dswingide.jar at a path that may not
// exist yet, and the desktop reports the IDE as unavailable.
//
// Two ways to obtain it:
//   * build swing-ide locally and copy app/build/libs/swing-ide-*-all.jar to
//     libs/swing-ide.jar, or
//   * ./gradlew fetchSwingIdeJar -PswingIdeJarUrl=<url> to download it.
// On-demand only (never wired into build); a present jar is left untouched.
tasks.register('fetchSwingIdeJar') {
    group = 'application'
    description = 'Download the swing-ide fat jar into libs/swing-ide.jar (pass -PswingIdeJarUrl=<url>); a present jar is left as-is.'
    def dest = rootProject.file('libs/swing-ide.jar')
    def url = project.findProperty('swingIdeJarUrl')?.toString()?.trim()
    doLast {
        if (dest.isFile()) {
            logger.lifecycle("swing-ide jar already present: ${dest}")
            return
        }
        if (!url) {
            throw new GradleException("No swing-ide jar at ${dest} and no -PswingIdeJarUrl given. "
                + 'Build swing-ide (./gradlew :app:shadowJar) and copy '
                + "app/build/libs/swing-ide-*-all.jar to ${dest}, or re-run with -PswingIdeJarUrl=<url>.")
        }
        dest.parentFile.mkdirs()
        ant.get(src: url, dest: dest, verbose: false)
        logger.lifecycle("Fetched swing-ide jar -> ${dest}")
    }
}

