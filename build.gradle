// -----------------------------------------------------------------------------
// documentationSite: generate a LOCAL, git-ignored preview of the API reference
// -----------------------------------------------------------------------------
// The GitHub Pages site (documentation/) does NOT publish the Javadoc. This task
// assembles every module's Javadoc into documentation/en/api/<module>/ purely as a
// local, browsable preview. That directory is git-ignored (see .gitignore) and must
// NEVER be committed: the reference is generated on demand from source, a committed
// copy would silently rot on the next API change, and shipping it would leak the
// full API onto the internet through Pages -- which this project explicitly does
// not do. Do not re-add documentation/en/api/ to the repository.
//
//   ./gradlew documentationSite      # (re)generate the local preview under documentation/en/api/
//
// Fails loudly if a module produces nothing: an empty module tree is a defect in
// that module's javadoc task, not a reason to silently drop the module from the
// preview. Not wired into `build`/`check` -- generating ten modules' Javadoc takes
// minutes, and the local preview only needs regenerating when you want to read it.
def apiModules = [
    'lg3d-escher'    : [dir: 'escher',        title: 'lg3d-escher (X11 protocol library)'],
    'lg3d-core'      : [dir: 'core',          title: 'lg3d-core (scene graph, windowing, display server SDK)'],
    'lg3d-apps'      : [dir: 'apps',          title: 'lg3d-apps (production desktop applications)'],
    'lg3d-incubator' : [dir: 'incubator',     title: 'lg3d-incubator (experimental applications)'],
    'lg3d-widgets'   : [dir: 'widgets',       title: 'lg3d-widgets (widget API and built-in widgets)'],
    'lg3d-mandela'   : [dir: 'mandela',       title: 'lg3d-mandela (the Mandela scripting language)'],
    'lpm-console'    : [dir: 'lpm-console',   title: 'lpm-console (package manager console)'],
    'update-manager' : [dir: 'update-manager', title: 'update-manager (update pipeline)'],
    'db-manager'     : [dir: 'db-manager',    title: 'db-manager (JDBC database client)'],
    'ftp-client'     : [dir: 'ftp-client',    title: 'ftp-client (FTP/FTPS/SFTP client)'],
]

tasks.register('documentationSite') {
    group = 'documentation'
    description = 'Generate every module\'s Javadoc into a LOCAL, git-ignored API preview under documentation/en/api/ (never committed, never published).'
    dependsOn apiModules.keySet().collect { ":${it}:javadoc" }

    doLast {
        def siteDir = rootProject.file('documentation/en/api')
        def items = new StringBuilder()
        apiModules.each { moduleName, spec ->
            def mod = project(moduleName)
            def src = mod.layout.buildDirectory.dir('docs/javadoc').get().asFile
            if (!new File(src, 'index.html').isFile()) {
                throw new GradleException("Javadoc for ${moduleName} produced no index.html under ${src}: "
                    + 'that module would be missing from the generated API preview. Fix the javadoc task '
                    + '(see the module console output) rather than dropping the module.')
            }
            def dst = new File(siteDir, spec.dir)
            // Replace, never merge: pages for classes that no longer exist would
            // otherwise linger in the local preview forever.
            project.delete(dst)
            project.copy { from src; into dst }
            items << "        <li><a href=\"${spec.dir}/index.html\">${spec.title}</a></li>\n"
            logger.lifecycle("API reference: ${moduleName} -> documentation/en/api/${spec.dir}/")
        }

        new File(siteDir, 'index.html').text = """<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Looking Glass - API Reference</title>
<style>
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
       margin: 0; padding: 2rem; background: #f7f8fa; color: #222; }
main { max-width: 56rem; margin: 0 auto; }
h1 { font-size: 1.8rem; margin-bottom: .25rem; }
p.lede { color: #555; margin-top: 0; }
ul { list-style: none; padding: 0; }
li { margin: .4rem 0; }
a { color: #2b5cad; text-decoration: none; }
a:hover { text-decoration: underline; }
nav { margin-top: 2rem; font-size: .9rem; }
footer { margin-top: 2rem; font-size: .85rem; color: #666; }
</style>
</head>
<body>
<main>
<h1>API Reference / R&eacute;f&eacute;rence d'API</h1>
<p class="lede">Javadoc generated from the source of each module. This is a LOCAL
preview only - it is git-ignored, never committed, and never published; the
documentation portals do not link it. Build it with <code>./gradlew documentationSite</code>.<br>
Javadoc g&eacute;n&eacute;e &agrave; partir des sources de chaque module. Ceci n'est qu'un aper&ccedil;u LOCAL -
ignor&eacute; par git, jamais commit&eacute; ni publi&eacute; ; les portails de documentation ne le lient
pas. Construisez-le avec <code>./gradlew documentationSite</code>.</p>
<ul>
${items}</ul>
<nav><a href="../index.html">Documentation portal / Portail de documentation</a>
&middot; <a href="../../README.md">documentation/README.md</a></nav>
<footer>Regenerate with <code>./gradlew documentationSite</code>. Do not edit these
files by hand.</footer>
</main>
</body>
</html>
"""
    }
}
