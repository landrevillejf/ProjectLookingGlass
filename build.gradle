decode -> tightly-packed RGBA -> glTexImage2D) and GlScene's per-entry base colour plus optional diffuse texture (vec4 uBaseColor, a uTexture sampler and a uUseTexture flag, with the texture modulated by the diffuse colour exactly as the java3d Texture2D path kept it as a tint). The pure material feed -- GlScene.sanitizeColor (null/short -> DEFAULT_BASE_COLOR, missing alpha -> opaque, no caller aliasing) and the colour/texture-carrying add() bookkeeping -- is asserted headless (GlSceneTest), as is GlTexture's degrade-never-throw guard: upload(null/empty) and dispose(null) return 0 / no-op rather than throwing (GlTextureTest). But upload()'s decode-and-GL body and GlScene.draw/bindTexture's texture branch genuinely need a live GL2ES3 that a headless JVM cannot construct, so those added probe-only lines grow the uncovered denominator and the measured fraction fell 0.4635 -> 0.4599 line / 0.5108 -> 0.5072 branch; both floors track that fraction down to a shade under, the same M8/P3.2 scene-graph-and-GL-uncoverable precedent, verified by the P2.5 probe, never a bar quietly lowered.
        'wonderland-avatars' : [line: 0.950, branch: 0.900],  // M6b: the bundled avatar .dae pool + the AvatarPool catalog that names it. The pure catalog class is small and fully testable (unique names, defaultName() present, every urlFor() resolvable through ClasspathWorldStore); the .dae bodies are resource bytes not code. Floor set at the level a tiny pure class should easily hit.
        'wonderland-desktop' : [line: 0.985, branch: 0.955],  // measured 0.9953 line / 0.9653 branch (was 0.619 / 0.714 at M6c2): the PURE mount/routing half of the wonderland-in-lg3d bridge. The lg3d-coupled classes that used to drag this ratio down -- WonderlandDesktop (the live Locale/AppConnector bootstrap), WonderlandWorldContainer (extends lg3d's Component3D), WorldInputRouter (the LgEventListener adapter) and WonderlandDesktopPlugin (the ServiceLoader provider) -- moved to lg3d-apps' org.jdesktop.lg3d.apps.wonderland package, so the dependency points lg3d -> wonderland and never wonderland -> lg3d and those probe-only scene-graph lines left this module's denominator. What remains is lg3d-free AND Java-3D-free and headless-tested: CellFrameBridge (the mount/unmount/transform/visibility book-keeping behind the FrameMounter seam), SessionFeed, PickRouter + PickDecision + PickIntent, WorldHudModel and WorldInventory. The residue is now a handful of defensive branches in those pure classes (PickDecision 1 line / 1 branch, WorldHudModel 2 branches, PickRouter and CellFrameBridge 1 branch each) -- no longer uncoverable scene graph -- so the floor sits a shade under the measured pure fraction, RAISED from the 0.610 / 0.710 the probe-only classes forced, never lowered.
    ]
    // Each exemption's reason: why 100% is not yet achievable in-JVM.
    // A module not listed above is held to 100% line and branch.
    def exemptionReasons = [
        'lg3d-apps'         : 'Swing app panels are probe-verified; pure logic classes are higher',
        'lg3d-core'         : 'scene graph needs live 3D desktop; displayserver.crash is at 92%/82% (123 tests)',
        'lg3d-widgets'      : 'Swing card presentation layer needs a live desktop',
        'lg3d-incubator'    : 'only Java-3D-free Swing panels exercised; ~184k-line 3D app tree untested',
        'lpm-console'       : 'logic classes ~100%; 853-line Swing panel is probe-verified only',
        'update-manager'    : 'Swing UI + download layers need a live desktop; ChangelogManager is fully covered',
        'db-manager'        : 'model/jdbc/session full via H2/SQLite; Swing UI is construction/probe-tested',
        'ftp-client'        : 'model/net/session full via MockFtpServer; Swing UI is construction/probe-tested',
        'lg3d-webserver'    : 'pure core headless-tested at every line/branch; residue is branches unreachable in-JVM (framework main, OS java-path fallback, contractually-never-null guards)',
        'lg3d-mandela'      : 'language toolchain goal is 100%/0 mutants; floor raised as each package closes',
        'wonderland-common' : 'M0-M1 seed; untested data-model periphery pulled in by later milestones',
        'wonderland-client' : 'residue: Throttle dead cancel, impossible DISK combo, renderer status walk (live Java 3D)',
        'wonderland-server' : 'defensive transport branches want fault injection',
        'wonderland-modules': 'defensive branches unreachable in-JVM (I/O faults, JAXB, ServiceLoader errors)',
        'wonderland-renderer': 'probe-only Java 3D assembly + GL passes cannot be constructed headless',
        'wonderland-avatars': 'placeholder pure catalog; floor set at level a small pure class should easily hit',
        'wonderland-desktop': 'handful of defensive branches in pure classes (PickDecision, WorldHudModel)',
    ]
    def floor = coverageExemptions[project.name]
    // A module's suite is what its gate can measure, so the suite is counted
    // first and both the JaCoCo rule below and the PIT rule after it key off it.
    def testJavaCount = fileTree('src/test/java').matching { include '**/*.java' }.size()
    if (testJavaCount > 0) {
        // The 1.0 default is what makes "100% is mandatory" true instead of a
        // slogan: a module with a suite and no entry in the map is held to every
        // line and every branch. An exemption is the only way down, and
        // coverage-floors.mnd fails an exemption that names a module with no
        // suite -- a rule that can never fire is not a rule.
        def lineMinimum = floor == null ? 1.0d : floor.line
        def branchMinimum = floor == null ? 1.0d : floor.branch
        tasks.named('jacocoTestCoverageVerification') {
            dependsOn 'test'
            violationRules {
                rule {
                    limit { counter = 'LINE';   value = 'COVEREDRATIO'; minimum = lineMinimum }
                }
                rule {
                    limit { counter = 'BRANCH'; value = 'COVEREDRATIO'; minimum = branchMinimum }
                }
            }
        }
        tasks.named('check') { dependsOn 'jacocoTestCoverageVerification' }
    } else {
        // No rule, and no pretending there is one. A module with no test source
        // has no execution data, so JaCoCo skips jacocoTestCoverageVerification
        // however many limits are configured -- wiring `check` to it here would
        // advertise a gate that can never fire (which is exactly what
        // lg3d-terminal's retired "80% mandatory" rule did). Such a module is
        // untested, full stop, and scripts/mandela/coverage-floors.mnd's noSuite
        // list is the place that has to say so, in both directions: a module with
        // main sources and no suite must be named there, and a listed module that
        // grows a suite must be deleted from it.
    }

    // -------------------------------------------------------------------------
    // Checkstyle (static analysis; fails the build on violations)
    // -------------------------------------------------------------------------
    // A single shared, high-signal config lives at config/checkstyle/. The task
    // runs as part of `check` with ignoreFailures=false, so a violation fails
    // the build. The HTML report is uploaded in CI.
    checkstyle {
        toolVersion = libs.versions.checkstyle.get()
        ignoreFailures = false
        configDirectory = rootProject.file('config/checkstyle')
    }
    tasks.withType(Checkstyle).configureEach {
        reports {
            xml.required = true
            html.required = true
        }
    }

    // -------------------------------------------------------------------------
    // Javadoc -- the source of the published API reference (documentation/en/api)
    // -------------------------------------------------------------------------
    // doclint is off: the ported ~200k-line tree carries 2006-era comment
    // defects (missing @param/@return, raw HTML) by the thousand, and the point
    // of this task here is the published reference, not a comment audit.
    // failOnError is deliberately left TRUE. Setting it false (as an earlier
    // revision did) made `./gradlew javadoc` exit 0 while whole modules emitted
    // an empty tree, which is exactly how five modules silently vanished from
    // the published API. A broken @link is fixed at the source, never by
    // deleting the sentence that carried it.
    // options.links resolves references to JDK types (javax.swing.Icon,
    // java.util.regex.Pattern, ...) to docs.oracle.com instead of rendering
    // them as dead plain text in the published pages.
    tasks.withType(Javadoc).configureEach {
        options.addStringOption('Xdoclint:none', '-quiet')
        options.links = ['https://docs.oracle.com/en/java/javase/21/docs/api/']
    }

    // -------------------------------------------------------------------------
    // PIT mutation testing (one rule for every module with a test suite)
    // -------------------------------------------------------------------------
    // AGENTS.md: 0 surviving mutants is mandatory. PIT is therefore configured
    // for EVERY module that has a suite -- there is no single module the figure
    // is quoted for, and no module the figure is quietly skipped for. The
    // structure is the JaCoCo one: a module not in the map below is gated at
    // mutationThreshold = 100 (every mutant killed), and a module that cannot yet
    // hit it appears in mutationExemptions with the score its own suite really
    // achieves, plus a reason in mutationReasons. PIT prints the measured score
    // when it fails, so an entry is always a number somebody ran, never a guess.
    //
    // Two guards keep the map honest, because a mutation gate is easy to fake:
    //   * failWhenNoMutations stays TRUE. A targetClasses scope that names no
    //     mutant would otherwise "pass" at 100% -- an empty scope is a red build,
    //     not free coverage, which is what stops a narrowed scope from pretending.
    //   * mutation-floors.mnd fails a threshold set anywhere except this map, so
    //     a module cannot lower its own bar in its own build file.
    //
    // PIT is deliberately NOT wired into `check`/`build`: a mutation run costs
    // minutes per module (and `build` runs on every save), so it is CI's own
    // mandatory step instead -- see the `mutation` job in
    // .github/workflows/build.yml, which runs every module and fails the pull
    // request on a threshold breach. A module's own `pitest {}` block may name
    // ONLY what to mutate (targetClasses / targetTests / avoidCallsTo / extra
    // JVM args); the engine, threads, formats and threshold live here.
    def mutationExemptions = [
        // Measured on this repository's own `pitest` task, JDK 21, threads=4, by
        // reading each module's own mutations.xml with PIT's own `detected`
        // attribute -- not by trusting the console line. db-manager: 901 mutants,
        // 473 KILLED + 11 TIMED_OUT = 484 detected = 53.7%, which PIT rounds and
        // prints as 54 ("Mutation score of 54 is below threshold of 100"). The
        // threshold sits one point under the printed figure because PIT rounds: a
        // re-run that lands at 53.6 must not read as a regression.
        //
        // The split of the 417 mutants that were NOT killed is the part that
        // matters for what to do next: 293 are NO_COVERAGE and only 124 SURVIVED.
        // A no-coverage mutant cannot be killed by any test, because no test
        // reaches the line -- so this floor is not an independent judgement from
        // the JaCoCo floor above (which is 0.620 for the same module, and PIT's
        // own line coverage of the mutated classes measured 1159/1833 = 63%), it
        // is the same untested Swing ui layer counted a second way. Raising it is
        // therefore the same single act: put the ui behind a seam the headless
        // suite can drive.
        'db-manager'  : 53,   // 901 mutants, 484 detected; 293 NO_COVERAGE + 124 SURVIVED
        // ftp-client: 991 mutants, 491 KILLED + 5 TIMED_OUT = 496 detected = 50.05%.
        // Same shape: 344 NO_COVERAGE against 151 SURVIVED, i.e. the dominant reason
        // a mutant lives here is also that no test reaches it, and JaCoCo's floor for
        // this module (0.600) is the same measurement from the other side.
        //
        // lpm-console: 279 mutants, 89 killed = 32%. The Swing console UI is probe-verified.
        'lpm-console' : 31,   // 279 mutants, 89 detected; Swing UI is probe-verified only
        // lg3d-widgets: 1217 mutants, 330 killed = 27%. The widget presentation layer needs a live desktop.
        'lg3d-widgets' : 26,  // 1217 mutants, 330 detected; Swing card presentation needs live desktop
        //
        // No module is listed below because its number is missing: an unmeasured
        // module is gated at 100 by default, and CI's `mutation` matrix produces the
        // figure. Writing an exemption here without a measured mutations.xml behind
        // it is how a floor becomes a way of avoiding a measurement.
        //
        // What the XML root's partial="true" does NOT mean, since a reader of the
        // report will meet it on every module: in PIT 1.17 that attribute is
        // XMLReportListener's `partialCoverage` constructor flag, fed from
        // ReportOptions.shouldReportCoverage() -- i.e. it is this build's own
        // exportLineCoverage = true, saying only that the exported line data covers
        // the mutated classes rather than the whole module. PIT's console says the
        // same thing: "Line Coverage (for mutated classes only)". It is not a
        // truncation warning, and no published report may label it one. A run that
        // truly died mid-way leaves an unclosed, unparseable XML, and that is the
        // only shape the release page treats as incomplete.
        'ftp-client'  : 50,   // 991 mutants, 496 detected; 344 NO_COVERAGE + 151 SURVIVED
        // wonderland-client: 1072 mutants, 902 killed = 84%. Residue: device-bound code paths (sound card, live Java 3D).
        'wonderland-client' : 83,  // 1072 mutants, 902 detected; Throttle dead cancel, renderer status walk need live Java 3D
        // wonderland-common: 1734 mutants, 538 killed = 31%. Untested data-model periphery.
        'wonderland-common' : 30,  // 1734 mutants, 538 detected; M0-M1 seed with untested data-model periphery
        // wonderland-modules: 89%. Defensive branches unreachable in-JVM.
        'wonderland-modules' : 88,  // Defensive branches (I/O faults, JAXB, ServiceLoader errors) unreachable in-JVM
        // lg3d-webserver: 380 mutants, 317 detected (309 KILLED + 7 TIMED_OUT + 1 RUN_ERROR) = 83%.
        // Of the 63 unkilled only 3 are NO_COVERAGE -- the framework main and the OS java-path
        // fallback JaCoCo also cannot reach; the other 60 SURVIVED sit on covered lines whose
        // tests assert the outcome but not the exact mutated token inside a detail message.
        'lg3d-webserver' : 82,  // Pure core headless-tested at 99% line; residue is 60 SURVIVED detail-message mutants + 3 unreachable NO_COVERAGE
        // wonderland-server: 87%. Defensive transport branches want fault injection.
        'wonderland-server' : 86,  // Defensive transport branches (IOException, pack/unpack failures) want fault injection
        // wonderland-renderer: 4248 mutations, 1790 killed = 42%. Probe-only Java 3D assembly + GL passes.
        'wonderland-renderer' : 41,  // Probe-only Java 3D assembly + GL passes cannot be constructed headless
        // wonderland-desktop: handful of defensive branches in pure classes.
        'wonderland-desktop' : 95,  // Handful of defensive branches in pure classes (PickDecision, WorldHudModel)
        // lg3d-incubator: only Java-3D-free Swing panels exercised; ~184k-line 3D app tree untested.
        'lg3d-incubator' : 3,  // measured 3%: only Java-3D-free Swing panels exercised; ~184k-line 3D app tree untested
        // update-manager: 1534 mutations, 641 killed = 42%. Swing UI + download layers need a live desktop.
        'update-manager' : 41,  // Swing UI + download layers need a live desktop; ChangelogManager is fully covered
        // lg3d-core: 25356 mutations, 4919 killed = 19%. Scene graph + displayserver need live desktop.
        'lg3d-core' : 18,  // Scene graph + displayserver need live 3D desktop; crash package is at 92%/82% (123 tests)
        // lg3d-mandela: 4646 mutations, 3658 killed = 79%. Residue: defensive branches in parser/compiler.
        'lg3d-mandela' : 78,  // Defensive branches in parser/compiler error paths want fault injection
        // lg3d-apps: 35548 mutations, 11206 killed = 32%. Swing app panels are probe-verified.
        'lg3d-apps' : 31,  // Swing app panels are probe-verified; pure logic classes are higher
    ]
    def mutationReasons = [
        'db-manager'  : '293 of its 417 unkilled mutants are NO_COVERAGE: the Swing ui package is never executed headless, so its lines cannot be killed by any test; model/jdbc/session are driven by real H2/SQLite',
        'ftp-client'  : '344 of its 495 unkilled mutants are NO_COVERAGE in the same Swing ui package; model/net/session are driven through MockFtpServer and mocked JSch',
        'lpm-console' : 'Swing console UI is probe-verified only; logic classes are fully mutated',
        'lg3d-widgets': 'Swing card presentation layer needs a live desktop; widget API is tested',
        'wonderland-client' : 'residue: Throttle dead cancel, impossible DISK combo, renderer status walk (live Java 3D)',
        'wonderland-common' : 'M0-M1 seed; untested data-model periphery pulled in by later milestones',
        'wonderland-modules': 'defensive branches unreachable in-JVM (I/O faults, JAXB, ServiceLoader errors)',
        'lg3d-webserver'    : '60 SURVIVED detail-message mutants on covered lines + 3 NO_COVERAGE unreachable in-JVM (framework main, OS java-path fallback)',
        'wonderland-server' : 'defensive transport branches want fault injection',
        'wonderland-renderer': 'probe-only Java 3D assembly + GL passes cannot be constructed headless',
        'wonderland-desktop': 'handful of defensive branches in pure classes (PickDecision, WorldHudModel)',
        'lg3d-incubator'    : 'only Java-3D-free Swing panels exercised; ~184k-line 3D app tree untested',
        'update-manager'    : 'Swing UI + download layers need a live desktop; ChangelogManager is fully covered',
        'lg3d-core'         : 'scene graph + displayserver need live 3D desktop; crash package is at 92%/82% (123 tests)',
        'lg3d-mandela'      : 'defensive branches in parser/compiler error paths want fault injection',
        'lg3d-apps'         : 'Swing app panels are probe-verified; pure logic classes are higher',
    ]
    if (testJavaCount > 0) {
        apply plugin: 'info.solidsoft.pitest'
        def mutFloor = mutationExemptions[project.name]
        // The extension is configured HERE (before each module's own `pitest {}`
        // block runs), so a module can add its scope without re-declaring the
        // regime. Configuring the PitestTask instead would be a bug: the task
        // has no pitestVersion / junit5PluginVersion property at all -- those
        // two exist only on the extension, where the plugin resolves them into
        // the engine classpath.
        pitest {
            pitestVersion = libs.versions.pitest.get()
            junit5PluginVersion = libs.versions.pitestJunit5.get()
            threads = 4
            outputFormats = ['HTML', 'XML']
            timestampedReports = false
            failWhenNoMutations = true
            // The runner's own line coverage is written beside the mutation
            // report, so a survivor and an uncovered line can be told apart by
            // a reader of the published HTML.
            exportLineCoverage = true
            mutationThreshold = (mutFloor == null ? 0 : mutFloor) as Integer
            // Mutants run in forked JVMs, which inherit nothing from the `test`
            // task: the same headless AWT and deterministic locale the suites
            // are written against, and a bounded heap so four threads of one
            // module cannot eat the CI runner.
            jvmArgs = ['-Xmx512m', '-Djava.awt.headless=true', '-Dlg.locale=en']
        }
    }

    // -------------------------------------------------------------------------
    // CycloneDX SBOM
    // -------------------------------------------------------------------------
    // `cyclonedxBom` writes a machine-readable Software Bill of Materials (exact
    // resolved component versions) per module under build-gradle/reports/; CI
    // uploads it. Addresses the audit's "No SBOM" gap for supply-chain
    // visibility. On-demand only (not wired into build), so it never slows the
    // compile/test path.
}

// -----------------------------------------------------------------------------
// SonarQube (one quality gate over the whole tree)
// -----------------------------------------------------------------------------
// Applied to the ROOT project alone, on purpose: the plugin walks every
// subproject by itself (it reads each one's java source sets and wires each
// one's JaCoCo XML report), so one `./gradlew sonar` analyses -- and one
// quality gate judges -- the whole desktop instead of 19 unrelated fragments
// under 19 keys. AGENTS.md states what the gate holds the tree to: 0 bugs, 0
// vulnerabilities, 0 code smells, 100% coverage on new code. The
// qualitygate.wait property is what turns that from a dashboard into a build
// result: the task blocks until the gate is computed and FAILS on a breach,
// rather than uploading a report and leaving a green pipeline behind.
//
// No server URL is committed. CI starts one (the `analysis` job of
// .github/workflows/build.yml runs a throwaway SonarQube service container) and
// a developer may point at their own with SONAR_HOST_URL / SONAR_TOKEN. A
// default placeholder host is deliberately absent -- that is exactly how an
// "analysis" step goes green while pushing its report nowhere.
apply plugin: 'org.sonarqube'
sonar {
    properties {
        property 'sonar.projectKey', 'lg3d'
        property 'sonar.projectName', 'Project Looking Glass'
        property 'sonar.projectVersion', project.version.toString()
        property 'sonar.sourceEncoding', 'UTF-8'
        property 'sonar.java.source', JavaVersion.VERSION_21.toString()
        property 'sonar.qualitygate.wait', 'true'
        // A gate still RUNNING when the scanner gives up must not read as a
        // pass; 5 minutes is generous for a community build of this size.
        property 'sonar.qualitygate.timeout', '300'
        // Exclude retired modules, generated code, and legacy paths that are
        // intentionally excluded from the build (see AGENTS.md "Code Exclusions"
        // and "Excluded from Build"). SonarQube analyzes the whole tree by
        // default, so without these exclusions it reports 120k+ bugs from code
        // that is not compiled, not maintained, and not part of the product.
        property 'sonar.exclusions',
            '**/build-gradle/**,' +
            '**/build/**,' +
            'lg3d-awt/**,' +
            'lg3d-x11/**,' +
            'lg3d-docs/**,' +
            'lg3d-art/**,' +
            'documentation/**,' +
            'lg3d-core/src/contrib/java/org/jdesktop/lg3d/awt/**,' +
            'lg3d-core/src/contrib/java/sun/awt/**,' +
            'lg3d-core/src/classes/org/jdesktop/lg3d/awt/**,' +
            'lg3d-core/src/classes/org/jdesktop/lg3d/displayserver/fws/x11/**,' +
            'lg3d-core/src/classes/org/jdesktop/lg3d/apps/x11integration/**,' +
            'lg3d-core/src/classes/org/jdesktop/lg3d/sg/internal/rmi/**,' +
            'lg3d-core/src/classes/org/jdesktop/lg3d/wg/internal/rmi/**,' +
            'lg3d-core/src/classes/org/jdesktop/lg3d/wg/**/j3dnodes/Ode*.java,' +
            'lg3d-escher/src/classes/gnu/**,' +
            'lg3d-incubator/src/classes/nu/koidelab/**,' +
            'lg3d-incubator/src/classes/apps/archviz3d/**,' +
            'lg3d-incubator/src/classes/apps/intel3d/**,' +
            'lg3d-incubator/src/classes/apps/browser/**,' +
            'lg3d-incubator/src/classes/apps/browser3d/**,' +
            'lg3d-incubator/src/classes/apps/wilkoaim3d/**'
    }
}
// The scanner uploads whatever JaCoCo XML already exists; running it before the
// reports would analyse a tree with no coverage and call the 0% real.
tasks.named('sonar') {
    dependsOn subprojects.collect { "${it.path}:jacocoTestReport" }
}

// -----------------------------------------------------------------------------
// OWASP dependency-check (CVE scanning) - root aggregate, hard gate
// -----------------------------------------------------------------------------
// `./gradlew dependencyCheckAggregate` scans every module's resolved
// dependencies against the NVD and writes HTML/JSON reports.
// failBuildOnCVSS = 7 is a REAL gate: a finding at CVSS >= 7 fails the task, and
// CI's `cve` job runs it with no `continue-on-error`, so a pull request cannot
// merge on top of an unaddressed high-severity CVE. An earlier revision of this
// file ran with failBuildOnCVSS = 11 (above the maximum possible score, i.e.
// never) and SECURITY.md called the whole scan "report-only"; then the same file
// was quietly switched to 7 while CI kept `continue-on-error: true`, which made
// both statements false -- the gate that cannot fail and the prose describing it
// were two different things, and neither matched the build.
//
// The one deliberate exception is enumerated, not implied. config/owasp/
// suppressions.xml holds one entry per vendored binary -- the 2006-era jars under
// lg3d-incubator/ext (log4j 1.2.8, axis, bcprov-jdk14, xercesImpl, JAI, JMF,
// JXTA, old commons-*) that SECURITY.md already names, and the two shaded jars
// under libs/ -- each matched by its own file path, each with a written
// justification and an `until` review date. Dependency-check stops applying an
// expired suppression, so an exclusion is a lease that comes back as a failing
// build rather than a permanent mute. A directory-wide pattern is forbidden: it
// would auto-cover the next jar somebody drops into ext/. scripts/mandela/
// cve-scope.mnd keeps all of that true -- every pattern must name a jar that
// exists on disk, no entry may use <cve>/<cpe>/<gav>/<packageUrl>/<name>/
// <cvssScore>, the build must stay at 7f, and no CI step may scan with
// `continue-on-error`.
//
// Pass -PnvdApiKey or set ORG_GRADLE_PROJECT_nvdApiKey for fast NVD feed
// downloads; the CI job budgets an hour for a cold sync rather than treating a
// slow feed as a reason to make the gate optional.
apply plugin: 'org.owasp.dependencycheck'
dependencyCheck {
    failBuildOnCVSS = 7f
    formats = ['HTML', 'JSON']
    suppressionFiles = [rootProject.file('config/owasp/suppressions.xml').absolutePath]
    // An NVD API key massively speeds the vulnerability-feed download.
    // Optional: pass -PnvdApiKey=KEY or set ORG_GRADLE_PROJECT_nvdApiKey. Guard
    // against an empty value (e.g. an unset CI secret expands to "").
    def nvdKey = project.findProperty('nvdApiKey')?.toString()?.trim()
    if (nvdKey) {
        nvd { apiKey = nvdKey }
    }
    // A failed analysis must not be mistaken for a clean one. failOnError is the
    // plugin default and is written here anyway, because the opposite -- an
    // interrupted NVD sync exiting 0 with an empty report -- is precisely how a
    // CVE gate starts passing without anything changing about the dependencies.
    // (autoUpdate stays at its default true: the scan has to reach the NVD.)
    failOnError = true
}

// -----------------------------------------------------------------------------
// fetchSwingIdeJar: fetch the vendored swing-ide fat jar on demand
// -----------------------------------------------------------------------------
// The IDE start-menu app (lg3d-apps, org.jdesktop.lg3d.apps.swingide) forks the
// external swing-ide project's self-contained fat jar as a separate child
// process. That jar is ~138 MB, above GitHub's 100 MB per-file push limit, so it
// is NOT committed: it is built by the swing-ide project (./gradlew
// :app:shadowJar) and fetched into libs/swing-ide.jar here (libs/swing-ide.jar
// is gitignored). Everything degrades gracefully when it is absent -- the run
// task / release launcher simply point -Dswingide.jar at a path that may not
// exist yet, and the desktop reports the IDE as unavailable.
//
// Two ways to obtain it:
//   * build swing-ide locally and copy app/build/libs/swing-ide-*-all.jar to
//     libs/swing-ide.jar, or
//   * ./gradlew fetchSwingIdeJar -PswingIdeJarUrl=<url> to download it.
// On-demand only (never wired into build); a present jar is left untouched.
tasks.register('fetchSwingIdeJar') {
    group = 'application'
    description = 'Download the swing-ide fat jar into libs/swing-ide.jar (pass -PswingIdeJarUrl=<url>); a present jar is left as-is.'
