// Root build for the LG3D (Project Looking Glass) modernization port.
// Targets JDK 21 + Gradle, replacing the original 2006-era Ant/source-1.5 build.

// Third-party build-analysis plugins, resolved from the version catalog and
// declared `apply false` here so their versions are managed once; each is
// enabled per module below. They are report-only / on-demand and never wired
// into the default `build` in a way that can red-line it (see each section).
plugins {
    alias(libs.plugins.cyclonedx) apply false
    alias(libs.plugins.pitest) apply false
    alias(libs.plugins.dependencyCheck) apply false
    alias(libs.plugins.sonarqube) apply false
    // Applied by wonderland-server only, so `bootRun`/`bootJar` exist for a
    // runnable, configurable server (see that module). apply false here just
    // puts it on the classpath with its version managed once.
    alias(libs.plugins.springboot) apply false
}

allprojects {
    group = 'org.jdesktop.lg3d'
    version = '1.69.0-dev'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java-library'
    // Test coverage measurement for the modules with test suites (lg3d-core,
    // lg3d-widgets). Configured in the jacoco block at the end of this section.
    apply plugin: 'jacoco'
    // Static analysis + SBOM + quality analysis. Checkstyle runs inside `check`
    // at zero tolerance -- ignoreFailures=false AND maxWarnings/maxErrors=0 (see
    // the Checkstyle block below) -- so ANY finding, warning severity included,
    // fails the build; CycloneDX writes a manifest on demand. SonarQube is
    // configured but not yet wired into `check` (needs the server URL).
    apply plugin: 'checkstyle'
    apply plugin: 'org.cyclonedx.bom'

    // Legacy modules ship their own 'build'/'clean' scripts (e.g. lg3d-escher),
    // so keep Gradle output in a separate directory to avoid clobbering them.
    layout.buildDirectory.set(file("$projectDir/build-gradle"))

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        if (name.toLowerCase().contains('test')) {
            // New / test code is held to a higher bar: surface real warnings.
            // No -Werror, so this informs the developer without failing build.
            options.compilerArgs << '-Xlint:all,-options,-path,-serial,-processing'
        } else {
            // The legacy main sources are extremely noisy under a modern
            // compiler (thousands of deprecation/unchecked/rawtypes warnings),
            // so they stay suppressed. AUDIT.md "Deferred" tracks re-enabling
            // -Xlint selectively as regions are modernized.
            options.compilerArgs << '-nowarn'
        }
    }

    tasks.withType(Jar).configureEach {
        // Preserve legacy behaviour: do not compress by default.
        zip64 = true
    }

    // -------------------------------------------------------------------------
    // Test coverage (JaCoCo)
    // -------------------------------------------------------------------------
    // AGENTS.md sets 100% line/branch coverage as the eventual goal. As a first
    // step the reports are now generated (HTML + XML) after every test run, so
    // `build` and CI actually surface coverage instead of leaving it "Unknown
    // (not measured)". No failing verification threshold is wired in yet: the
    // ported codebase is ~200k lines with a small Java-3D-free test suite, so a
    // hard gate would red-line every build. Layer jacocoTestCoverageVerification
    // onto individual modules as their coverage becomes meaningful.
    tasks.withType(Test).configureEach {
        // Deterministic i18n baseline: shell labels resolve through the run's
        // language at class-load time, so suites that assert the English
        // literals pin the desktop locale to en here (a test that wants
        // French sets the lg.locale sysprop itself and resets LgLocale).
        systemProperty 'lg.locale', 'en'
        finalizedBy 'jacocoTestReport'
    }
    tasks.withType(JacocoReport).configureEach {
        reports {
            xml.required = true    // machine-readable; uploaded as a CI artifact
            html.required = true   // human-readable browsable report
        }
    }

    // -------------------------------------------------------------------------
    // Coverage exemptions (JaCoCo verification)
    // -------------------------------------------------------------------------
    // AGENTS.md sets 100% line/branch coverage as the goal, and the rule is
    // enforced rather than announced: EVERY module with a test suite is held to
    // 100% unless it appears in the coverageExemptions map below, where it must
    // carry its measured ratio AND a reason in exemptionReasons. A module in the
    // map is allowed to sit at its measured maximum achievable ratio; a
    // regression below that ratio fails `check`. A module with no test source is
    // the one case a ratio cannot describe (there is nothing to cover and
    // jacocoTestCoverageVerification would run on no execution data), so it gets
    // no rule and instead has to be named in scripts/mandela/coverage-floors.mnd's
    // no-suite list. Raise a module's ratio as coverage improves; delete its
    // entry once it reaches 100% -- an entry that stops being needed is a finding.
    def coverageExemptions = [
        'lg3d-apps'     : [line: 0.400, branch: 0.350],  // measured 40% line (the Swing app panels are probe-verified; the pure logic classes are higher)
        'lg3d-core'     : [line: 0.225, branch: 0.310],  // measured 22.83% / 31.56% (the displayserver.crash package is at 92.43% line / 82.16% branch - 123 headless tests; the rest is the 2006-era scene graph, which needs a live 3D desktop)
        'lg3d-widgets'  : [line: 0.480, branch: 0.400],  // measured 50.11% / 41.64%
        'lg3d-incubator': [line: 0.005, branch: 0.005],  // measured 0.63% / 0.72% (only the Office + Games Java 3D-free Swing panels are exercised; the ~184k-line 3D app tree is untested, but each panel is ~78-100% line-covered)
        'lpm-console'   : [line: 0.240, branch: 0.300],  // measured 26.7% / 36.9% (logic classes ~100%; the 853-line Swing panel is probe-verified)
        'update-manager': [line: 0.595, branch: 0.560],  // measured 60.29% / 56.86% (was 56.35% / 51.54% before the changelog reader learned this repository's own Keep a Changelog vocabulary - the whole of ChangelogManager's parse and inline-markdown path is now driven by 28 cases, and the rest of the module is the Swing ui + download layers that want a live desktop)
        'db-manager'    : [line: 0.620, branch: 0.570],  // measured 63.36% / 58.51% (model+jdbc+session ~full via real H2/SQLite; the Swing ui layer is construction/probe-tested)
        'ftp-client'    : [line: 0.600, branch: 0.520],  // measured 61.96% / 54.84% (model+net+session ~full via in-JVM MockFtpServer + mocked JSch; the Swing ui layer is construction/probe-tested)
        'lg3d-webserver': [line: 0.985, branch: 0.975],  // measured 99.02-99.16% / 98.10% (the line figure moves with whether RealProcessLauncher's gobble-IOException race is hit on a given run; the floor sits under both ends) (the Spring Boot management server that deploys containerized Spring Boot apps via the system docker CLI and forks local bootJars -- built as an executable bootJar and, like wonderland-server, deliberately absent from the desktop classpath: the console reaches it over HTTP and as a child process. The pure core is driven headless with no daemon, no display and no real fork: DeploymentRegistry (id/name/context-path/port assignment so two deploys never collide, failure-kind separation, reconcile-back-to-STOPPED, JSON persistence across instances) over FakeDockerCli + FakeChildProcessStarter -- now at every line and every branch, its defensive catch arms reached by a fault-injecting StubBackend (a deploy/start/stop/remove/isRunning that throws DeploymentException vs RuntimeException), an orphan registry whose persisted app has no backend, and hand-derived blank/null name/image/jarPath/contextPath inputs; DockerDeploymentBackend's exact argv + start->run fallback + no-daemon degradation + fail()/firstNonBlank() detail fallbacks (blank, negative-exit and null streams); JarProcessBackend's fork/track/tail/stop; ReverseProxyFilter's longest-prefix routing and real forwarding against an in-JVM com.sun.net.httpserver (502 on an unreachable app, on an interrupt, and skipped on a committed response; hop-by-hop and null header names dropped; empty upstream body; empty query; HEAD without a body); the standalone-MockMvc management API over every endpoint; ManagementAuthGate's constant-time bearer gate; the real RealProcessLauncher/RealChildProcessStarter interrupt, bounded-window and SIGTERM-escalation paths over genuine short-lived children; and a @SpringBootTest(RANDOM_PORT) context that boots with docker disabled and proves health/info/400/503 end to end. The residue is now only branches genuinely unreachable in-JVM: WebServerApplication.main (the framework entry point, exercised by bootRun not a unit test), JarProcessBackend.javaExecutable's Windows java.exe / bare-java fallback (the CI JVM always resolves bin/java), RealProcessLauncher's gobble IOException race + joinQuietly interrupt (waitFor throws first) + the process==null arm, and ReverseProxyFilter's null-guards on values that are contractually never null (an upstream header name, a response body, an escape message). The floor sits a shade under the measured ratio, raised as each closes.)
        'lg3d-mandela'  : [line: 0.932, branch: 0.856],  // measured 93.27% / 85.65% (JUnit unit suites + Cucumber BDD + the Machine* suites that address the VM in its own instruction set. The api package is now at 100% line and 100% branch: its reachable residue is closed by white-box tests -- the JSR-223 engine's null-key skip over an exotic Bindings, for-loop type/wildcard patterns in the editor walk, a non-value annotation, a call whose callee is not a plain name, and the registry-missing seam -- and its provably-dead defensive guards are removed rather than left as branches no test can ever fire (redundant null-checks behind checked(), a generic-Throwable fallthrough whose callers catch only two subtypes, an interface getMethods() Object-method arm that never occurs, a blank-source-name arm sourceNameOf already rules out, a double-checked-locking race arm, and a lenient parser's never-thrown catch). The language toolchain's goal remains 100% line/branch and 0 surviving mutants per lg3d-mandela/AGENTS.md, and this floor is raised as each package closes; code, lang, cli, vm, rt and values follow.)
        'wonderland-common' : [line: 0.300, branch: 0.200],  // measured 32.36% / 21.48% (M0 seed: the com.jme math/bounding shim, Math3DUtils, the CellTransform pipeline through vecmath Matrix4d, and the ChecksumList JAXB round-trip. M1 adds the wire-protocol codec pins: MessagePackerTest + CommsMessagesCodecTest + CellMessagesCodecTest cover every MessageID/Message envelope, the session handshake types, and every cell/{messages,comms/messages,messages} wire class -- 43 new cases on top of M0's 77, all through the Java serialisation + Wonderland class-descriptor-id path that the M3 Spring Boot WebSocket handler will use. The remaining ~65% is the still-untested data-model periphery -- modules, security, jaxb adapters, login -- that each later milestone pulls into scope)
        'wonderland-renderer' : [line: 0.456, branch: 0.504],  // measured 0.4599 line / 0.5072 branch (P2.4 + P2.3 + P3.3-P3.5 + P2.7; was 0.4948 / 0.5192 at P3.2, 0.496 / 0.522 at M8 and 0.669 / 0.670 at M7c), floor set a shade under so a small refactor does not immediately break -- the Collada cell renderer rebuilt on org.jogamp.java3d. The pure conversion (ColladaMeshBuilder: mesh sources/inputs/packed <p> -> flat per-primitive triangle-soup vertex/index arrays; WorldTransformMath: node world matrix / CellTransform -> a row-major double[16] Transform3D feed; TextureBindingPlan: material -> effect -> sampler -> image -> present/missing -> colour/texture binding; CellRendererFactory: the RENDERER_JME/NONE dispatch decision) is unit-tested headless. M7c lands the jME-Animator replacement as a pure animation package -- ChannelTarget (the node/sid.element[.ARRAY] vocabulary), KeyframeTrack (right-continuous LINEAR/STEP sampling), AnimationClip (per-node tracks -> Matrix4d pose via Rodrigues), ColladaClips (the raw-to-playable factory: slot model, the stride-4 axis+angle bundle, BEZIER collapse, time normalisation, degrade-never-throw), SyntheticClips (the unrigged idle/walking/waving fallback), AnimationLibrary and AvatarAnimationDirector (loop/gesture/alias policy on an injected clock) -- 70 new cases, the crown AvatarAnimationBundledPoolTest driving the REAL shipped humanoid-a.dae bytes through the whole chain. The probe-only Java 3D assembly (J3dMeshFactory building IndexedTriangleArray/Shape3D/Appearance, ModelRenderer's BranchGroup/TransformGroup live ops, WonderlandModelCell wiring the seam) constructs Jogamp scene-graph objects that cannot be built without a live 3D canvas, so it is verified by the in-JVM probe, not asserted -- exactly the lg3d-core precedent (scene graph uncoverable in CI, floor set for the pure fraction). M8 adds the world browser's live window -- WorldViewer (a Canvas3D/SimpleUniverse frame you walk with the keyboard and read back a raster from), WorldScene's Java 3D assembly (addModel/addPictures/addShadows/addTags building Shape3D/Appearance/TransformGroup), NameTag's billboard aim and WorldViewer$CaptureBehavior's GraphicsContext3D.readRaster -- none of which can be constructed without a display, so the pure fraction fell from 0.669 to 0.496 and this floor tracks that fraction: the added lines are probe-only, covered by WorldRenderProbeTest's in-JVM screencapture (every shipped world plus the clinic renders), not asserted in CI -- the same scene-graph-uncoverable precedent as lg3d-core and wonderland-desktop, never a bar quietly lowered. P3.2 adds the live GPU bloom -- GpuBloomPass (the production GL bright-pass/blur/composite chain) and BloomCanvas (the Canvas3D.preSwap adapter that drives it), reached only through the patched java3d-core pre-swap hook -- whose ~200 GL lines are probe-only exactly like the M8 Java 3D assembly (a GLContext cannot be constructed headless), verified by WlProbe56 at 94 fps with the visible halo read off the swapped framebuffer; the pure PostProcessPlan route decision and GpuBloomPass.Settings ARE asserted (PostProcessPlanTest, GpuBloomPassTest), so the measured fraction only slipped 0.496 -> 0.4948 line / 0.522 -> 0.5192 branch and this floor stayed put -- it still clears both, so accounting for the added probe-only GL is a comment refresh, never a bar lowered. P3.3 (HDR), P3.4 (FXAA), P3.5 (DOF) and P2.7 (SSAO) each add a second such live GL pass -- GpuHdrPass (165 lines), GpuFxaaPass (160), GpuDofPass (177), GpuSsaoPass (181) plus their Canvas3D.preSwap adapters -- probe-only for the same reason (a GLContext needs a display, so a headless JVM constructs only their Settings records, ~7-8% of each), each verified by its own in-JVM WlProbe with the effect read off the swapped framebuffer. Those ~683 GL lines grow the uncovered denominator, so the measured LINE fraction fell 0.4948 -> 0.4637; the pure kernel each GL pass is checked against -- HdrKernel, FxaaKernel, DofKernel, SsaoKernel with their Settings/Frame records and PostProcessPlan -- is asserted at 98-100% (SsaoKernel 0.989 line / 0.971 branch, DofKernel 0.975 / 0.962, the rest 1.000; the two residue branches are SsaoKernel.normalize's zero-length guard and DofKernel's unreachable n==0 centre-sample fallback). The BRANCH floor did NOT move: pinning the kernels' degenerate-input guards -- the Frame height<=0 and argb==null TRUE sides and FxaaKernel's range<=0 divide-by-zero guard at a zero contrast floor -- recovered the branch fraction to 0.5112, so 0.510 still holds. Only the LINE floor tracks the added probe-only GL down to a shade under its measured 0.4637, the same M8 scene-graph-uncoverable precedent (0.669 -> 0.496 when the live WorldViewer window landed), never a bar quietly lowered. P2.3 adds GlView -- the JOGL GLEventListener that draws a GlScene through a Camera into a GLCanvas and runs the SAME Gpu*Pass chain over the presented frame, which is the per-frame seam stock java3d lacked (each GpuPostEffect already captures the drawable's target framebuffer, processes and composites back, so SSAO->bloom->HDR->DOF->FXAA compose in order with the passes unchanged and no patched preSwap() hook). Its pure half -- buildChain (the composition order and the per-feature WorldFeatures gating), the constructor guards, the accessors and capturePreview's null-GL short-circuit -- is asserted headless (GlViewTest); the GL callbacks (init/display/reshape/dispose), createCanvas and capturePreview's glReadPixels are probe-only for the same reason as every Gpu*Pass (a GLContext cannot be built headless), to be measured by the P2.5 probe. The pure tests offset most of the added probe-only GL, so the measured fraction moved only 0.4637 -> 0.4635 line / 0.5112 -> 0.5108 branch and both floors still hold, never a bar lowered. P2.4 makes the JOGL scene texture-capable so it can render a real COLLADA world at parity -- GlTexture (encoded image bytes -> a mipmapped GL 2D texture via ImageIO decode -> tightly-packed RGBA -> glTexImage2D) and GlScene's per-entry base colour plus optional diffuse texture (vec4 uBaseColor, a uTexture sampler and a uUseTexture flag, with the texture modulated by the diffuse colour exactly as the java3d Texture2D path kept it as a tint). The pure material feed -- GlScene.sanitizeColor (null/short -> DEFAULT_BASE_COLOR, missing alpha -> opaque, no caller aliasing) and the colour/texture-carrying add() bookkeeping -- is asserted headless (GlSceneTest), as is GlTexture's degrade-never-throw guard: upload(null/empty) and dispose(null) return 0 / no-op rather than throwing (GlTextureTest). But upload()'s decode-and-GL body and GlScene.draw/bindTexture's texture branch genuinely need a live GL2ES3 that a headless JVM cannot construct, so those added probe-only lines grow the uncovered denominator and the measured fraction fell 0.4635 -> 0.4599 line / 0.5108 -> 0.5072 branch; both floors track that fraction down to a shade under, the same M8/P3.2 scene-graph-and-GL-uncoverable precedent, verified by the P2.5 probe, never a bar quietly lowered.
    ]
    // Each exemption's reason: why 100% is not yet achievable in-JVM.
    // A module not listed above is held to 100% line and branch.
    def exemptionReasons = [
        'lg3d-apps'         : 'Swing app panels are probe-verified; pure logic classes are higher',
        'lg3d-core'         : 'scene graph needs live 3D desktop; displayserver.crash is at 92%/82% (123 tests)',
        'lg3d-widgets'      : 'Swing card presentation layer needs a live desktop',
        'lg3d-incubator'    : 'only Java-3D-free Swing panels exercised; ~184k-line 3D app tree untested',
        'lpm-console'       : 'logic classes ~100%; 853-line Swing panel is probe-verified only',
        'update-manager'    : 'Swing UI + download layers need a live desktop; ChangelogManager is fully covered',
        'db-manager'        : 'model/jdbc/session full via H2/SQLite; Swing UI is construction/probe-tested',
        'ftp-client'        : 'model/net/session full via MockFtpServer; Swing UI is construction/probe-tested',
        'lg3d-webserver'    : 'pure core headless-tested at every line/branch; residue is branches unreachable in-JVM (framework main, OS java-path fallback, contractually-never-null guards)',
        'lg3d-mandela'      : 'language toolchain goal is 100%/0 mutants; floor raised as each package closes',
        'wonderland-common' : 'M0-M1 seed; untested data-model periphery pulled in by later milestones',
        'wonderland-renderer': 'probe-only Java 3D assembly + GL passes cannot be constructed headless',
    ]
    def floor = coverageExemptions[project.name]
    // A module's suite is what its gate can measure, so the suite is counted
    // first and both the JaCoCo rule below and the PIT rule after it key off it.
    def testJavaCount = fileTree('src/test/java').matching { include '**/*.java' }.size()
    if (testJavaCount > 0) {
        // The 1.0 default is what makes "100% is mandatory" true instead of a
        // slogan: a module with a suite and no entry in the map is held to every
        // line and every branch. An exemption is the only way down, and
        // coverage-floors.mnd fails an exemption that names a module with no
        // suite -- a rule that can never fire is not a rule.
        def lineMinimum = floor == null ? 1.0d : floor.line
        def branchMinimum = floor == null ? 1.0d : floor.branch
        tasks.named('jacocoTestCoverageVerification') {
            dependsOn 'test'
            violationRules {
                rule {
                    limit { counter = 'LINE';   value = 'COVEREDRATIO'; minimum = lineMinimum }
                }
                rule {
                    limit { counter = 'BRANCH'; value = 'COVEREDRATIO'; minimum = branchMinimum }
                }
            }
        }
        tasks.named('check') { dependsOn 'jacocoTestCoverageVerification' }
    } else {
        // No rule, and no pretending there is one. A module with no test source
        // has no execution data, so JaCoCo skips jacocoTestCoverageVerification
        // however many limits are configured -- wiring `check` to it here would
        // advertise a gate that can never fire (which is exactly what
        // lg3d-terminal's retired "80% mandatory" rule did). Such a module is
        // untested, full stop, and scripts/mandela/coverage-floors.mnd's noSuite
        // list is the place that has to say so, in both directions: a module with
        // main sources and no suite must be named there, and a listed module that
        // grows a suite must be deleted from it.
    }

    // -------------------------------------------------------------------------
    // Checkstyle (static analysis; fails the build on violations)
    // -------------------------------------------------------------------------
    // A single shared, high-signal config lives at config/checkstyle/. The task
    // runs as part of `check` at zero tolerance (ignoreFailures=false plus the
    // maxWarnings/maxErrors=0 pinned below), so any finding fails the build.
    // The HTML report is uploaded in CI.
    checkstyle {
        toolVersion = libs.versions.checkstyle.get()
        ignoreFailures = false
        configDirectory = rootProject.file('config/checkstyle')
    }
    tasks.withType(Checkstyle).configureEach {
        // checkstyle.xml sets severity=warning, and Gradle's Checkstyle task
        // defaults maxWarnings/maxErrors to Integer.MAX_VALUE -- so with
        // ignoreFailures=false ALONE a warning-severity finding still exits 0.
        // That is why "BUILD SUCCESSFUL" here never meant "0 violations". Pinning
        // both thresholds to 0 makes ANY finding fail the task, hence `check`,
        // hence the CI build job and the pull request. Every module is at zero
        // today (the per-module cleanup PRs #436-#445), so this ratchets the gate
        // shut instead of reddening an already-dirty tree; a PR that reintroduces
        // a violation now fails CI rather than merging silently.
        maxWarnings = 0
        maxErrors = 0
        reports {
            xml.required = true
            html.required = true
        }
    }

    // -------------------------------------------------------------------------
    // Javadoc -- the source of the published API reference (documentation/en/api)
    // -------------------------------------------------------------------------
    // doclint is off: the ported ~200k-line tree carries 2006-era comment
    // defects (missing @param/@return, raw HTML) by the thousand, and the point
    // of this task here is the published reference, not a comment audit.
    // failOnError is deliberately left TRUE. Setting it false (as an earlier
    // revision did) made `./gradlew javadoc` exit 0 while whole modules emitted
    // an empty tree, which is exactly how five modules silently vanished from
    // the published API. A broken @link is fixed at the source, never by
    // deleting the sentence that carried it.
    // options.links resolves references to JDK types (javax.swing.Icon,
    // java.util.regex.Pattern, ...) to docs.oracle.com instead of rendering
    // them as dead plain text in the published pages.
    tasks.withType(Javadoc).configureEach {
        options.addStringOption('Xdoclint:none', '-quiet')
        options.links = ['https://docs.oracle.com/en/java/javase/21/docs/api/']
    }

    // -------------------------------------------------------------------------
    // PIT mutation testing (one rule for every module with a test suite)
    // -------------------------------------------------------------------------
    // AGENTS.md: 0 surviving mutants is mandatory. PIT is therefore configured
    // for EVERY module that has a suite -- there is no single module the figure
    // is quoted for, and no module the figure is quietly skipped for. The gate
    // inverts the JaCoCo one: a module absent from the map below runs PIT in
    // report-only mode (mutationThreshold = 0, no gate) until it is ready to be
    // held to a figure, and a module that is ready is added to mutationExemptions
    // gated at the score its own suite really achieves, plus a reason in
    // mutationReasons -- a floor ratcheted up toward 100 as survivors are killed.
    // PIT prints the measured score
    // when it fails, so an entry is always a number somebody ran, never a guess.
    //
    // Two guards keep the map honest, because a mutation gate is easy to fake:
    //   * failWhenNoMutations stays TRUE. A targetClasses scope that names no
    //     mutant would otherwise "pass" at 100% -- an empty scope is a red build,
    //     not free coverage, which is what stops a narrowed scope from pretending.
    //   * mutation-floors.mnd fails a threshold set anywhere except this map, so
    //     a module cannot lower its own bar in its own build file.
    //
    // PIT is deliberately NOT wired into `check`/`build`: a mutation run costs
    // minutes per module (and `build` runs on every save), so it is CI's own
    // mandatory step instead -- see the `mutation` job in
    // .github/workflows/build.yml, which runs every module and fails the pull
    // request on a threshold breach. A module's own `pitest {}` block may name
    // ONLY what to mutate (targetClasses / targetTests / avoidCallsTo / extra
    // JVM args); the engine, threads, formats and threshold live here.
    def mutationExemptions = [
        // Measured on this repository's own `pitest` task, JDK 21, threads=4, by
        // reading each module's own mutations.xml with PIT's own `detected`
        // attribute -- not by trusting the console line. db-manager: 901 mutants,
        // 473 KILLED + 11 TIMED_OUT = 484 detected = 53.7%, which PIT rounds and
        // prints as 54 ("Mutation score of 54 is below threshold of 100"). The
        // threshold sits one point under the printed figure because PIT rounds: a
        // re-run that lands at 53.6 must not read as a regression.
        //
        // The split of the 417 mutants that were NOT killed is the part that
        // matters for what to do next: 293 are NO_COVERAGE and only 124 SURVIVED.
        // A no-coverage mutant cannot be killed by any test, because no test
        // reaches the line -- so this floor is not an independent judgement from
        // the JaCoCo floor above (which is 0.620 for the same module, and PIT's
        // own line coverage of the mutated classes measured 1159/1833 = 63%), it
        // is the same untested Swing ui layer counted a second way. Raising it is
        // therefore the same single act: put the ui behind a seam the headless
        // suite can drive.
        'db-manager'  : 53,   // 901 mutants, 484 detected; 293 NO_COVERAGE + 124 SURVIVED
        // ftp-client: 991 mutants, 491 KILLED + 5 TIMED_OUT = 496 detected = 50.05%.
        // Same shape: 344 NO_COVERAGE against 151 SURVIVED, i.e. the dominant reason
        // a mutant lives here is also that no test reaches it, and JaCoCo's floor for
        // this module (0.600) is the same measurement from the other side.
        //
        // lpm-console: 279 mutants, 89 killed = 32%. The Swing console UI is probe-verified.
        'lpm-console' : 31,   // 279 mutants, 89 detected; Swing UI is probe-verified only
        // lg3d-widgets: 1217 mutants, 330 killed = 27%. The widget presentation layer needs a live desktop.
        'lg3d-widgets' : 26,  // 1217 mutants, 330 detected; Swing card presentation needs live desktop
        //
        // No module is listed below because its number is missing: an unlisted
        // module runs report-only (mutationThreshold = 0, no gate) by default, and
        // CI's `mutation` matrix produces the figure that earns it a real floor.
        // Writing an exemption here without a measured mutations.xml behind it is
        // how a floor becomes a way of avoiding a measurement.
        //
        // What the XML root's partial="true" does NOT mean, since a reader of the
        // report will meet it on every module: in PIT 1.17 that attribute is
        // XMLReportListener's `partialCoverage` constructor flag, fed from
        // ReportOptions.shouldReportCoverage() -- i.e. it is this build's own
        // exportLineCoverage = true, saying only that the exported line data covers
        // the mutated classes rather than the whole module. PIT's console says the
        // same thing: "Line Coverage (for mutated classes only)". It is not a
        // truncation warning, and no published report may label it one. A run that
        // truly died mid-way leaves an unclosed, unparseable XML, and that is the
        // only shape the release page treats as incomplete.
        'ftp-client'  : 50,   // 991 mutants, 496 detected; 344 NO_COVERAGE + 151 SURVIVED
        // wonderland-client: 1072 mutants, 902 killed = 84%. Residue: device-bound code paths (sound card, live Java 3D).
        'wonderland-client' : 83,  // 1072 mutants, 902 detected; Throttle dead cancel, renderer status walk need live Java 3D
        // wonderland-common: 1734 mutants, 538 killed = 31%. Untested data-model periphery.
        'wonderland-common' : 30,  // 1734 mutants, 538 detected; M0-M1 seed with untested data-model periphery
        // wonderland-modules: 89%. Defensive branches unreachable in-JVM.
        'wonderland-modules' : 88,  // Defensive branches (I/O faults, JAXB, ServiceLoader errors) unreachable in-JVM
        // lg3d-webserver: 380 mutants, 317 detected (309 KILLED + 7 TIMED_OUT + 1 RUN_ERROR) = 83%.
        // Of the 63 unkilled only 3 are NO_COVERAGE -- the framework main and the OS java-path
        // fallback JaCoCo also cannot reach; the other 60 SURVIVED sit on covered lines whose
        // tests assert the outcome but not the exact mutated token inside a detail message.
        'lg3d-webserver' : 82,  // Pure core headless-tested at 99% line; residue is 60 SURVIVED detail-message mutants + 3 unreachable NO_COVERAGE
        // wonderland-server: 87%. Defensive transport branches want fault injection.
        'wonderland-server' : 86,  // Defensive transport branches (IOException, pack/unpack failures) want fault injection
        // wonderland-renderer: 4248 mutations, 1790 killed = 42%. Probe-only Java 3D assembly + GL passes.
        'wonderland-renderer' : 41,  // Probe-only Java 3D assembly + GL passes cannot be constructed headless
        // wonderland-desktop: handful of defensive branches in pure classes.
        'wonderland-desktop' : 95,  // Handful of defensive branches in pure classes (PickDecision, WorldHudModel)
        // lg3d-incubator: only Java-3D-free Swing panels exercised; ~184k-line 3D app tree untested.
        'lg3d-incubator' : 3,  // measured 3%: only Java-3D-free Swing panels exercised; ~184k-line 3D app tree untested
        // update-manager: 1534 mutations, 641 killed = 42%. Swing UI + download layers need a live desktop.
        'update-manager' : 41,  // Swing UI + download layers need a live desktop; ChangelogManager is fully covered
        // lg3d-core: 25356 mutations, 4919 killed = 19%. Scene graph + displayserver need live desktop.
        'lg3d-core' : 18,  // Scene graph + displayserver need live 3D desktop; crash package is at 92%/82% (123 tests)
        // lg3d-mandela: 3774 of 4621 mutations detected = 81% (CI PIT, partial report). The vm package
        // went from 60 to 23 unkilled (Frame 0). Residue: defensive branches in parser/compiler.
        'lg3d-mandela' : 80,  // Defensive branches in parser/compiler error paths want fault injection
        // lg3d-apps: 35548 mutations, 11206 killed = 32%. Swing app panels are probe-verified.
        'lg3d-apps' : 31,  // Swing app panels are probe-verified; pure logic classes are higher
    ]
    def mutationReasons = [
        'db-manager'  : '293 of its 417 unkilled mutants are NO_COVERAGE: the Swing ui package is never executed headless, so its lines cannot be killed by any test; model/jdbc/session are driven by real H2/SQLite',
        'ftp-client'  : '344 of its 495 unkilled mutants are NO_COVERAGE in the same Swing ui package; model/net/session are driven through MockFtpServer and mocked JSch',
        'lpm-console' : 'Swing console UI is probe-verified only; logic classes are fully mutated',
        'lg3d-widgets': 'Swing card presentation layer needs a live desktop; widget API is tested',
        'wonderland-client' : 'residue: Throttle dead cancel, impossible DISK combo, renderer status walk (live Java 3D)',
        'wonderland-common' : 'M0-M1 seed; untested data-model periphery pulled in by later milestones',
        'wonderland-modules': 'defensive branches unreachable in-JVM (I/O faults, JAXB, ServiceLoader errors)',
        'lg3d-webserver'    : '60 SURVIVED detail-message mutants on covered lines + 3 NO_COVERAGE unreachable in-JVM (framework main, OS java-path fallback)',
        'wonderland-server' : 'defensive transport branches want fault injection',
        'wonderland-renderer': 'probe-only Java 3D assembly + GL passes cannot be constructed headless',
        'wonderland-desktop': 'handful of defensive branches in pure classes (PickDecision, WorldHudModel)',
        'lg3d-incubator'    : 'only Java-3D-free Swing panels exercised; ~184k-line 3D app tree untested',
        'update-manager'    : 'Swing UI + download layers need a live desktop; ChangelogManager is fully covered',
        'lg3d-core'         : 'scene graph + displayserver need live 3D desktop; crash package is at 92%/82% (123 tests)',
        'lg3d-mandela'      : 'defensive branches in parser/compiler error paths want fault injection',
        'lg3d-apps'         : 'Swing app panels are probe-verified; pure logic classes are higher',
    ]
    if (testJavaCount > 0) {
        apply plugin: 'info.solidsoft.pitest'
        def mutFloor = mutationExemptions[project.name]
        // The extension is configured HERE (before each module's own `pitest {}`
        // block runs), so a module can add its scope without re-declaring the
        // regime. Configuring the PitestTask instead would be a bug: the task
        // has no pitestVersion / junit5PluginVersion property at all -- those
        // two exist only on the extension, where the plugin resolves them into
        // the engine classpath.
        pitest {
            pitestVersion = libs.versions.pitest.get()
            junit5PluginVersion = libs.versions.pitestJunit5.get()
            threads = 4
            outputFormats = ['HTML', 'XML']
            timestampedReports = false
            failWhenNoMutations = true
            // The runner's own line coverage is written beside the mutation
            // report, so a survivor and an uncovered line can be told apart by
            // a reader of the published HTML.
            exportLineCoverage = true
            mutationThreshold = (mutFloor == null ? 0 : mutFloor) as Integer
            // Mutants run in forked JVMs, which inherit nothing from the `test`
            // task: the same headless AWT and deterministic locale the suites
            // are written against, and a bounded heap so four threads of one
            // module cannot eat the CI runner.
            jvmArgs = ['-Xmx512m', '-Djava.awt.headless=true', '-Dlg.locale=en']
        }
    }

    // -------------------------------------------------------------------------
    // CycloneDX SBOM
    // -------------------------------------------------------------------------
    // `cyclonedxBom` writes a machine-readable Software Bill of Materials (exact
    // resolved component versions) per module under build-gradle/reports/; CI
    // uploads it. Addresses the audit's "No SBOM" gap for supply-chain
    // visibility. On-demand only (not wired into build), so it never slows the
    // compile/test path.
}

// -----------------------------------------------------------------------------
// SonarQube (one quality gate over the whole tree)
// -----------------------------------------------------------------------------
// Applied to the ROOT project alone, on purpose: the plugin walks every
// subproject by itself (it reads each one's java source sets and wires each
// one's JaCoCo XML report), so one `./gradlew sonar` analyses -- and one
// quality gate judges -- the whole desktop instead of 19 unrelated fragments
// under 19 keys. AGENTS.md states what the gate holds the tree to: 0 bugs, 0
// vulnerabilities, 0 code smells, 100% coverage on new code. The
// qualitygate.wait property is what turns that from a dashboard into a build
// result: the task blocks until the gate is computed and FAILS on a breach,
// rather than uploading a report and leaving a green pipeline behind.
//
// No server URL is committed. CI starts one (the `analysis` job of
// .github/workflows/build.yml runs a throwaway SonarQube service container) and
// a developer may point at their own with SONAR_HOST_URL / SONAR_TOKEN. A
// default placeholder host is deliberately absent -- that is exactly how an
// "analysis" step goes green while pushing its report nowhere.
apply plugin: 'org.sonarqube'
sonar {
    properties {
        property 'sonar.projectKey', 'lg3d'
        property 'sonar.projectName', 'Project Looking Glass'
        property 'sonar.projectVersion', project.version.toString()
        property 'sonar.sourceEncoding', 'UTF-8'
        property 'sonar.java.source', JavaVersion.VERSION_21.toString()
        property 'sonar.qualitygate.wait', 'true'
        // A gate still RUNNING when the scanner gives up must not read as a
        // pass; 5 minutes is generous for a community build of this size.
        property 'sonar.qualitygate.timeout', '300'
        // Exclude retired modules, generated code, and legacy paths that are
        // intentionally excluded from the build (see AGENTS.md "Code Exclusions"
        // and "Excluded from Build"). SonarQube analyzes the whole tree by
        // default, so without these exclusions it reports 120k+ bugs from code
        // that is not compiled, not maintained, and not part of the product.
        property 'sonar.exclusions',
            '**/build-gradle/**,' +
            '**/build/**,' +
            'lg3d-awt/**,' +
            'lg3d-x11/**,' +
            'lg3d-docs/**,' +
            'lg3d-art/**,' +
            'documentation/**,' +
            'lg3d-core/src/contrib/java/org/jdesktop/lg3d/awt/**,' +
            'lg3d-core/src/contrib/java/sun/awt/**,' +
            'lg3d-core/src/classes/org/jdesktop/lg3d/awt/**,' +
            'lg3d-core/src/classes/org/jdesktop/lg3d/displayserver/fws/x11/**,' +
            'lg3d-core/src/classes/org/jdesktop/lg3d/apps/x11integration/**,' +
            'lg3d-core/src/classes/org/jdesktop/lg3d/sg/internal/rmi/**,' +
            'lg3d-core/src/classes/org/jdesktop/lg3d/wg/internal/rmi/**,' +
            'lg3d-core/src/classes/org/jdesktop/lg3d/wg/**/j3dnodes/Ode*.java,' +
            'lg3d-escher/src/classes/gnu/**,' +
            'lg3d-incubator/src/classes/nu/koidelab/**,' +
            'lg3d-incubator/src/classes/apps/archviz3d/**,' +
            'lg3d-incubator/src/classes/apps/intel3d/**,' +
            'lg3d-incubator/src/classes/apps/browser/**,' +
            'lg3d-incubator/src/classes/apps/browser3d/**,' +
            'lg3d-incubator/src/classes/apps/wilkoaim3d/**'
    }
}
// The scanner uploads whatever JaCoCo XML already exists; running it before the
// reports would analyse a tree with no coverage and call the 0% real.
tasks.named('sonar') {
    dependsOn subprojects.collect { "${it.path}:jacocoTestReport" }
}

// -----------------------------------------------------------------------------
// OWASP dependency-check (CVE scanning) - root aggregate, hard gate
// -----------------------------------------------------------------------------
// `./gradlew dependencyCheckAggregate` scans every module's resolved
// dependencies against the NVD and writes HTML/JSON reports.
// failBuildOnCVSS = 7 is a REAL gate: a finding at CVSS >= 7 fails the task, and
// CI's `cve` job runs it with no `continue-on-error`, so a pull request cannot
// merge on top of an unaddressed high-severity CVE. An earlier revision of this
// file ran with failBuildOnCVSS = 11 (above the maximum possible score, i.e.
// never) and SECURITY.md called the whole scan "report-only"; then the same file
// was quietly switched to 7 while CI kept `continue-on-error: true`, which made
// both statements false -- the gate that cannot fail and the prose describing it
// were two different things, and neither matched the build.
//
// The one deliberate exception is enumerated, not implied. config/owasp/
// suppressions.xml holds one entry per vendored binary -- the 2006-era jars under
// lg3d-incubator/ext (log4j 1.2.8, axis, bcprov-jdk14, xercesImpl, JAI, JMF,
// JXTA, old commons-*) that SECURITY.md already names, and the two shaded jars
// under libs/ -- each matched by its own file path, each with a written
// justification and an `until` review date. Dependency-check stops applying an
// expired suppression, so an exclusion is a lease that comes back as a failing
// build rather than a permanent mute. A directory-wide pattern is forbidden: it
// would auto-cover the next jar somebody drops into ext/. scripts/mandela/
// cve-scope.mnd keeps all of that true -- every pattern must name a jar that
// exists on disk, no entry may use <cve>/<cpe>/<gav>/<packageUrl>/<name>/
// <cvssScore>, the build must stay at 7f, and no CI step may scan with
// `continue-on-error`.
//
// Pass -PnvdApiKey or set ORG_GRADLE_PROJECT_nvdApiKey for fast NVD feed
// downloads; the CI job budgets an hour for a cold sync rather than treating a
// slow feed as a reason to make the gate optional.
apply plugin: 'org.owasp.dependencycheck'
dependencyCheck {
    failBuildOnCVSS = 7f
    formats = ['HTML', 'JSON']
    suppressionFiles = [rootProject.file('config/owasp/suppressions.xml').absolutePath]
    // An NVD API key massively speeds the vulnerability-feed download.
    // Optional: pass -PnvdApiKey=KEY or set ORG_GRADLE_PROJECT_nvdApiKey. Guard
    // against an empty value (e.g. an unset CI secret expands to "").
    def nvdKey = project.findProperty('nvdApiKey')?.toString()?.trim()
    if (nvdKey) {
        nvd { apiKey = nvdKey }
    }
    // A failed analysis must not be mistaken for a clean one. failOnError is the
    // plugin default and is written here anyway, because the opposite -- an
    // interrupted NVD sync exiting 0 with an empty report -- is precisely how a
    // CVE gate starts passing without anything changing about the dependencies.
    // (autoUpdate stays at its default true: the scan has to reach the NVD.)
    failOnError = true
}

// -----------------------------------------------------------------------------
// fetchSwingIdeJar: fetch the vendored swing-ide fat jar on demand
// -----------------------------------------------------------------------------
// The IDE start-menu app (lg3d-apps, org.jdesktop.lg3d.apps.swingide) forks the
// external swing-ide project's self-contained fat jar as a separate child
// process. That jar is ~138 MB, above GitHub's 100 MB per-file push limit, so it
// is NOT committed: it is built by the swing-ide project (./gradlew
// :app:shadowJar) and fetched into libs/swing-ide.jar here (libs/swing-ide.jar
// is gitignored). Everything degrades gracefully when it is absent -- the run
// task / release launcher simply point -Dswingide.jar at a path that may not
// exist yet, and the desktop reports the IDE as unavailable.
//
// Two ways to obtain it:
//   * build swing-ide locally and copy app/build/libs/swing-ide-*-all.jar to
//     libs/swing-ide.jar, or
//   * ./gradlew fetchSwingIdeJar -PswingIdeJarUrl=<url> to download it.
// On-demand only (never wired into build); a present jar is left untouched.
tasks.register('fetchSwingIdeJar') {
    group = 'application'
    description = 'Download the swing-ide fat jar into libs/swing-ide.jar (pass -PswingIdeJarUrl=<url>); a present jar is left as-is.'
    def dest = rootProject.file('libs/swing-ide.jar')
    def url = project.findProperty('swingIdeJarUrl')?.toString()?.trim()
    doLast {
        if (dest.isFile()) {
            logger.lifecycle("swing-ide jar already present: ${dest}")
            return
        }
        if (!url) {
            throw new GradleException("No swing-ide jar at ${dest} and no -PswingIdeJarUrl given. "
                + 'Build swing-ide (./gradlew :app:shadowJar) and copy '
                + "app/build/libs/swing-ide-*-all.jar to ${dest}, or re-run with -PswingIdeJarUrl=<url>.")
        }
        dest.parentFile.mkdirs()
        ant.get(src: url, dest: dest, verbose: false)
        logger.lifecycle("Fetched swing-ide jar -> ${dest}")
    }
}

