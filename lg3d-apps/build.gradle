// lg3d-apps: the production desktop applications shipped with LG3D (plus a few
// tutorial/sample apps). Formerly named lg3d-demo-apps -- a legacy label; the
// software is production-grade, and the config/demo resource path below is also a
// legacy name kept as-is so lg3d-core's descriptor discovery still resolves it.
//
// Ported from the 2006-era Ant build (lg3d-apps/build.xml). Pure Java,
// compiled against lg3d-core (which exposes the Jogamp Java 3D API transitively)
// and packaged into lg3d-apps.jar. Resources live next to the sources under
// src/classes (per-app "resources" trees, shader .frag/.vert files, icons) and
// the desktop app descriptors under src/config are bundled into config/demo, as
// the legacy build did.

sourceSets {
    main {
        java {
            srcDir 'src/classes'
            include 'org/**'
        }
        resources {
            // Pick up the non-Java files that sit alongside the sources
            // (org/jdesktop/lg3d/apps/*/resources/**, *.frag, *.vert, images).
            // For CallViewer (SourceViewer), we also include the .java source files
            // as resources so the app can visualize its own code.
            srcDir 'src/classes'
            include 'org/**'
            // ServiceLoader registrations for the Web Browser extension SPI (the
            // built-in reference extensions under .../webbrowser/ext/builtin).
            // These live outside the org/** tree, so they need an explicit
            // include to be bundled into lg3d-apps.jar.
            include 'META-INF/services/**'
            // Specifically include the .java files for CallViewer
            include 'org/jdesktop/lg3d/apps/callviewer/*.java'
            include 'org/jdesktop/lg3d/apps/cdviewer/CDViewer.java'
            include 'org/jdesktop/lg3d/apps/tapps/WebIcon.java'
            include 'org/jdesktop/lg3d/apps/tapps/WebIcon2.java'
            include 'org/jdesktop/lg3d/apps/help/Lg3dHelp.java'
            include 'org/jdesktop/lg3d/apps/bgmanager/*.java'
            
            // We still want to exclude other .java files to keep the jar size reasonable
            // unless they are specifically included above. Gradle's include/exclude 
            // logic: if any include matches, it's included, UNLESS an exclude matches.
            // So we need to be careful with global excludes.
            exclude { FileTreeElement details ->
                details.file.name.endsWith('.java') && 
                !details.path.contains('org/jdesktop/lg3d/apps/callviewer/') &&
                !details.path.contains('org/jdesktop/lg3d/apps/cdviewer/CDViewer.java') &&
                !details.path.contains('org/jdesktop/lg3d/apps/tapps/WebIcon') &&
                !details.path.contains('org/jdesktop/lg3d/apps/help/Lg3dHelp.java') &&
                !details.path.contains('org/jdesktop/lg3d/apps/bgmanager/')
            }
            exclude '**/*.form'
        }
    }
    test {
        java {
            srcDir 'src/test/java'
        }
    }
}

// The legacy build copied src/config into the jar under config/demo.
//
// The Help Center (org.jdesktop.lg3d.apps.help) ships a JavaHelp HelpSet whose
// full-text Search view needs a pre-built search database ("JavaSearch"). It is
// generated here from the authored HTML topics by JavaHelp's own indexer
// (com.sun.java.help.search.Indexer, bundled in the javahelp jar) and copied
// into the classpath tree beside the HelpSet by processResources.
def helpContentDir = file('src/classes/org/jdesktop/lg3d/apps/help/helpcontent')
def helpSearchDir = layout.buildDirectory.dir('generated-help/JavaSearch')

tasks.register('generateHelpSearchIndex', JavaExec) {
    group = 'build'
    description = 'Build the JavaHelp full-text search database for the Help Center topics.'
    // The indexer ships inside the javahelp jar; resolve it into a detached
    // configuration so this task does not depend on the app compile classpath.
    classpath = configurations.detachedConfiguration(
            dependencies.create("javax.help:javahelp:${libs.versions.javahelp.get()}"))
    mainClass = 'com.sun.java.help.search.Indexer'
    def topics = fileTree(helpContentDir) { include '*.html' }
    inputs.files(topics)
    outputs.dir(helpSearchDir)
    doFirst {
        // The indexer updates the database in place; start clean each build.
        delete helpSearchDir.get().asFile
        // Usage: Indexer -db <database-dir> <topic-file>... (see the tool's help).
        // Set here (not via argumentProviders) so the captured values are not
        // introspected as unannotated task properties, and resolved lazily.
        args = (['-db', helpSearchDir.get().asFile.absolutePath] +
                topics.files.collect { it.absolutePath })
    }
}

processResources {
    dependsOn 'generateHelpSearchIndex'
    from('src/config') {
        into 'config/demo'
    }
    // Land the generated search database beside the HelpSet so its Search view
    // (data "JavaSearch") resolves at runtime from both the jar and the classes.
    from(helpSearchDir) {
        into 'org/jdesktop/lg3d/apps/help/helpcontent/JavaSearch'
    }
}

jar {
    archiveBaseName = 'lg3d-apps'
    // Stamp the canonical project version into the manifest so the About app
    // (org.jdesktop.lg3d.apps.about.AboutInfo) can resolve the build version
    // from AboutInfo.class.getPackage().getImplementationVersion() when run
    // outside the Gradle run task (which instead passes -Dlg.version). Both
    // paths read the single project.version, so no literal version is added.
    manifest {
        attributes(
                'Implementation-Title': 'lg3d-apps',
                'Implementation-Version': project.version.toString())
    }
}

// -----------------------------------------------------------------------------
// Web Browser extension API jar (on-demand)
// -----------------------------------------------------------------------------
// The Web Browser extension SPI (org.jdesktop.lg3d.apps.webbrowser.ext) is what
// third-party extension developers compile against (see
// docs/webbrowser-extensions.md). They need ONLY the public contract -- the
// BrowserExtension interface plus its immutable value types -- not the whole
// lg3d-apps jar (JavaFX, Java 3D, every other app) and not the browser's
// internal runtime. These two tasks package that stable subset into a small
// standalone API jar (plus a sources jar) that
// .github/workflows/release-webbrowser-api.yml publishes as its own dedicated
// GitHub Release. They are on-demand (not wired into `build`/`assemble`), so the
// ordinary compile/test path and the desktop release bundle are unaffected.
//
// Contents rule: the top-level ext package (ext/*.class, which by construction
// excludes the ext/builtin/** reference implementations) MINUS the three
// internal runtime classes that are not part of the developer contract:
//   - ExtensionRegistry  ServiceLoader/URLClassLoader discovery; it also
//                        references the parent-package BrowserStore, so it is
//                        not standalone-compilable.
//   - ExtensionBroker    the browser's hook dispatcher.
//   - ExtensionState     persistence DTO for enable/grant state.
// The remaining ext types have no dependency on those (verified), so the jar is
// self-consistent. A NEW value type added to ext is published automatically; a
// new *internal* class must be added to the exclude lists below.
//
// -PreleaseVersion=<v> overrides the stamped version (the release workflow passes
// it); otherwise the canonical project.version is used.
def webBrowserExtApi = 'org/jdesktop/lg3d/apps/webbrowser/ext'
def webBrowserApiVersion = (findProperty('releaseVersion') ?: project.version).toString()

tasks.register('webBrowserApiJar', Jar) {
    group = 'build'
    description = 'Package the standalone Web Browser extension API jar (the ...webbrowser.ext SPI + value types only).'
    dependsOn sourceSets.main.classesTaskName
    archiveBaseName = 'lg3d-webbrowser-ext-api'
    archiveVersion = webBrowserApiVersion
    from(sourceSets.main.output.classesDirs) {
        include "${webBrowserExtApi}/*.class"
        exclude "${webBrowserExtApi}/ExtensionRegistry*.class"
        exclude "${webBrowserExtApi}/ExtensionBroker*.class"
        exclude "${webBrowserExtApi}/ExtensionState*.class"
    }
    manifest {
        attributes(
                'Implementation-Title': 'lg3d-webbrowser-ext-api',
                'Implementation-Version': webBrowserApiVersion)
    }
}

tasks.register('webBrowserApiSourcesJar', Jar) {
    group = 'build'
    description = 'Package the sources for the Web Browser extension API jar (developer convenience).'
    archiveBaseName = 'lg3d-webbrowser-ext-api'
    archiveVersion = webBrowserApiVersion
    archiveClassifier = 'sources'
    from(sourceSets.main.allJava) {
        include "${webBrowserExtApi}/*.java"
        exclude "${webBrowserExtApi}/ExtensionRegistry.java"
        exclude "${webBrowserExtApi}/ExtensionBroker.java"
        exclude "${webBrowserExtApi}/ExtensionState.java"
    }
    manifest {
        attributes(
                'Implementation-Title': 'lg3d-webbrowser-ext-api (sources)',
                'Implementation-Version': webBrowserApiVersion)
    }
}

tasks.named('test') {
    useJUnitPlatform()
    // The Help Center's HelpSet-loading test constructs a JHelp but never shows
    // it, so it runs headless on CI (no X display).
    systemProperty 'java.awt.headless', 'true'
    // Opt-in real JDI debugger integration test (spawns a child JVM): forward
    // the flag so `./gradlew test -Dlg3d.debug.integration=true` enables it.
    if (System.getProperty('lg3d.debug.integration') != null) {
        systemProperty 'lg3d.debug.integration',
                System.getProperty('lg3d.debug.integration')
    }
}

dependencies {
    implementation project(':lg3d-core')
    // Mandela: the desktop's own scripting language (module :lg3d-mandela).
    // Espresso's bundled MandelaTools extension and the Web Browser's Mandela
    // userscript bridge call its public API (org.jdesktop.lg3d.mandela.api.*)
    // directly, so the language jar is a compile dep here. It is ALSO resolved
    // onto the lg3d-core desktop run classpath and into the release bundle (see
    // lg3d-core/build.gradle), otherwise the in-JVM text editor dies with
    // NoClassDefFoundError: org/jdesktop/lg3d/mandela/api/Mandela.
    implementation project(':lg3d-mandela')
    // Apache PDFBox (Apache-2.0) powers the PDF Viewer's page rasterisation
    // (org.jdesktop.lg3d.apps.pdfviewer). It is also resolved onto the lg3d-core
    // desktop run classpath (see lg3d-core/build.gradle) so the in-JVM
    // start-menu launch can find org.apache.pdfbox.*.
    implementation libs.pdfbox
    // JavaHelp (javax.help) powers the Help Center viewer. It is also resolved
    // onto the lg3d-core desktop run classpath (see lg3d-core/build.gradle) so
    // the in-JVM start-menu launch can find javax.help.*.
    implementation libs.javahelp
    // Apache Commons Compress (Apache-2.0) powers the Archive app
    // (org.jdesktop.lg3d.apps.archive): browsing, extracting and creating every
    // common open archive format (zip, tar, tar.gz/.tgz, tar.bz2, tar.xz, gz,
    // bz2, xz, cpio, ar, 7z). XZ for Java (org.tukaani:xz) is the optional codec
    // Commons Compress delegates .xz / .lzma to. Both are ALSO resolved onto the
    // lg3d-core desktop run classpath and into the release bundle (see
    // lg3d-core/build.gradle), so the in-JVM start-menu launch can find
    // org.apache.commons.compress.* and org.tukaani.xz.*.
    implementation libs.commons.compress
    implementation libs.xz
    // The Software Update app (org.jdesktop.lg3d.apps.update) wraps the
    // update-manager module's Swing pipeline (UpdateService / UpdatePresenter /
    // UpdateSettingsPanel). Its runtime deps (jackson-databind, slf4j,
    // bouncycastle) are resolved onto the lg3d-core desktop run classpath too
    // (see lg3d-core/build.gradle), so the in-JVM start-menu launch works.
    implementation project(':update-manager')

    // The Database Manager app (org.jdesktop.lg3d.apps.dbmanager) wraps the
    // db-manager module's JDBC client (DbManagerMainPanel). Its runtime deps
    // (jackson-databind, slf4j, and the bundled SQLite/H2/PostgreSQL/MariaDB
    // drivers) are resolved onto the lg3d-core desktop run classpath too (see
    // lg3d-core/build.gradle), so the in-JVM start-menu launch works.
    implementation project(':db-manager')

    // The FTP Client app (org.jdesktop.lg3d.apps.ftpclient) wraps the
    // ftp-client module's file-transfer client (FtpClientMainPanel). Its
    // runtime deps (commons-net, jsch, jackson-databind, slf4j, bouncycastle)
    // are resolved onto the lg3d-core desktop run classpath too (see
    // lg3d-core/build.gradle), so the in-JVM start-menu launch works.
    implementation project(':ftp-client')
    implementation 'com.github.mwiede:jsch:0.2.24'
    // Jackson + SLF4J for the SSH Client's profile persistence and logging.
    // These are NOT transitive from :ftp-client (which uses `implementation`),
    // so they must be declared here for compile-time access.
    implementation libs.jackson.databind
    implementation libs.slf4j.api

    // The Web Browser app (org.jdesktop.lg3d.apps.webbrowser) renders pages with
    // a real WebKit engine via JavaFX (OpenJFX) javafx.scene.web.WebView, bridged
    // into the Swing desktop with javafx.embed.swing.JFXPanel (javafx-swing).
    // OpenJFX publishes its classes + platform natives in a per-OS classifier
    // jar, so the `linux` classifier is pinned explicitly (the desktop is a
    // Linux X11 target; this mirrors the Jogamp natives pattern in lg3d-core).
    // These are compile deps here; they are ALSO resolved onto the lg3d-core
    // desktop run classpath and into the release bundle (see lg3d-core/
    // build.gradle), otherwise the in-JVM start-menu launch dies with
    // NoClassDefFoundError: javafx/scene/web/WebView.
    def openjfx = libs.versions.openjfx.get()
    implementation "org.openjfx:javafx-base:${openjfx}:linux"
    implementation "org.openjfx:javafx-graphics:${openjfx}:linux"
    implementation "org.openjfx:javafx-controls:${openjfx}:linux"
    implementation "org.openjfx:javafx-media:${openjfx}:linux"
    implementation "org.openjfx:javafx-web:${openjfx}:linux"
    implementation "org.openjfx:javafx-swing:${openjfx}:linux"

    // The Docker Manager app (org.jdesktop.lg3d.apps.dockermanager) is a port of
    // the Swing IDE docker plugin: its DockerManagementPanel draws every toolbar
    // button, tab and context-menu glyph through the bundled IconManager library
    // (libs/IconManager-1.6.0.jar), which is what preserves the plugin's exact
    // appearance. IconManager is already on the lg3d-core desktop run classpath
    // (see lg3d-core/build.gradle), so it is compile-only here; it is added to
    // the test classpath too so the headless panel test can construct the UI.
    compileOnly files(rootProject.file('libs/IconManager-1.6.0.jar'))
    testImplementation files(rootProject.file('libs/IconManager-1.6.0.jar'))

    // The Remote Viewer app (org.jdesktop.lg3d.apps.remoteviewer) is a port of
    // the standalone jrdesktop/Remote Viewer RMI remote-desktop tool, which
    // uses Lombok's @Slf4j on its Server/Viewer/Main/SysTray classes for SLF4J
    // loggers (slf4j-api above already provides the facade). Lombok is
    // compile-time only, centrally versioned (see gradle/libs.versions.toml),
    // same as update-manager's usage.
    compileOnly libs.lombok
    annotationProcessor libs.lombok

    // Headless JUnit 5 for the HelpSet / content-integrity test.
    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.platform.launcher
}
